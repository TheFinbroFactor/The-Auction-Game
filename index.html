<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Auction Wars</title>
<style>
  :root{
    --bg:#06060b;
    --bg-2:#0b0b14;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --border-2:rgba(255,255,255,.14);
    --gold:#fbbf24;
    --gold-2:#f59e0b;
    --gold-3:#fde68a;
    --green:#34d399;
    --green-2:#10b981;
    --red:#f87171;
    --purple:#a78bfa;
    --blue:#60a5fa;
    --text:#f5f5f7;
    --muted:#8a8a99;
    --muted-2:#5f5f6e;
    --radius:18px;
    --shadow-lg:0 20px 60px rgba(0,0,0,.55);
    --shadow-md:0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(251,191,36,.10), transparent 60%),
      radial-gradient(circle at 12% 8%, rgba(99,102,241,.20) 0%, transparent 42%),
      radial-gradient(circle at 90% 100%, rgba(168,85,247,.16) 0%, transparent 45%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:16px 14px 44px;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .app{width:100%;max-width:540px}
  .screen{display:none;animation:fade .35s cubic-bezier(.2,.7,.3,1)}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
  @keyframes pulseGold{
    0%,100%{box-shadow:0 0 0 1px rgba(251,191,36,.35), 0 0 24px rgba(251,191,36,.18)}
    50%{box-shadow:0 0 0 1px rgba(251,191,36,.55), 0 0 36px rgba(251,191,36,.30)}
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea{font-family:inherit}
  ::selection{background:rgba(251,191,36,.3);color:#fff}

  /* ============ HEADER ============ */
  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:4px 2px 16px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(145deg,#fbbf24,#f59e0b 55%,#b45309);
    box-shadow:0 6px 20px rgba(251,191,36,.35), inset 0 1px 0 rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;color:#1a1206;letter-spacing:-.5px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.05}
  .brand-name{font-size:15px;font-weight:900;letter-spacing:.3px}
  .brand-sub{font-size:9.5px;color:var(--muted-2);font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:7px}
  .icon-btn{
    width:36px;height:36px;border-radius:11px;
    background:var(--panel);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;transition:.15s;
  }
  .icon-btn:active{background:var(--panel-2);transform:scale(.95)}
  .icon-btn.active{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.4)}
  .user-chip{
    display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:99px;
    background:var(--panel);border:1px solid var(--border);transition:.15s;
    max-width:150px;
  }
  .user-chip:active{background:var(--panel-2)}
  .user-avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,#a78bfa,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:#fff;overflow:hidden;
  }
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-name{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .signin-btn{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;
    background:linear-gradient(135deg,#fff,#e8e8ee);color:#1a1a1f;
    font-size:11.5px;font-weight:800;letter-spacing:.2px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .signin-btn:active{transform:scale(.97)}

  /* ============ SHARED UI ============ */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  .label{
    font-size:10.5px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .label .hint{font-size:10px;letter-spacing:.3px;text-transform:none;font-weight:700;color:var(--muted-2)}
  .btn-primary{
    width:100%;padding:17px;border-radius:16px;font-size:15px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#1a1206;
    box-shadow:0 10px 30px rgba(251,191,36,.28), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .1s, box-shadow .2s;
    text-transform:uppercase;
  }
  .btn-primary:active{transform:scale(.98);box-shadow:0 4px 14px rgba(251,191,36,.25)}
  .btn-primary:disabled{opacity:.35;box-shadow:none;pointer-events:none}
  .btn-secondary{
    width:100%;padding:14px;border-radius:14px;font-size:13.5px;font-weight:800;letter-spacing:.5px;
    background:var(--panel-2);border:1px solid var(--border-2);color:var(--text);
    transition:.15s;
  }
  .btn-secondary:active{background:rgba(255,255,255,.12)}
  .btn-ghost{
    padding:14px 16px;border-radius:14px;font-size:13px;font-weight:800;letter-spacing:.4px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
  }
  .btn-ghost:active{background:var(--panel-2)}
  .rules{color:var(--muted);font-size:11.5px;text-align:center;line-height:1.65;margin:16px 6px 0;font-weight:600}
  .muted{color:var(--muted)}

  /* ============ SETUP ============ */
  .hero{text-align:center;padding:8px 0 22px}
  .hero h1{
    margin:0;font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1;
  }
  .hero h1 span{
    background:linear-gradient(100deg,#fde68a,#fbbf24 40%,#f59e0b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--muted);font-size:12.5px;margin:10px 0 0;font-weight:600;letter-spacing:.3px}

  .pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack{
    position:relative;
    padding:12px 11px;border-radius:14px;font-size:12.5px;font-weight:800;
    background:var(--panel);border:1px solid var(--border);
    color:var(--text);transition:.15s;text-align:left;
    display:flex;flex-direction:column;gap:4px;line-height:1.3;
    overflow:hidden;
  }
  .pack::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(251,191,36,.18),transparent 60%);
    opacity:0;transition:.2s;
  }
  .pack.sel{
    background:rgba(251,191,36,.12);
    border-color:rgba(251,191,36,.55);
    color:var(--gold);
    box-shadow:0 0 0 1px rgba(251,191,36,.2), 0 6px 20px rgba(251,191,36,.14);
  }
  .pack.sel::before{opacity:1}
  .pack .pname{position:relative;display:block}
  .pack .pcount{
    font-size:9.5px;font-weight:800;color:var(--muted-2);letter-spacing:.5px;
    position:relative;
  }
  .pack.sel .pcount{color:rgba(251,191,36,.8)}
  .pack.new{
    border-style:dashed;border-color:rgba(255,255,255,.16);
    align-items:center;justify-content:center;text-align:center;
    color:var(--muted);font-weight:900;letter-spacing:.5px;min-height:58px;
    flex-direction:row;gap:6px;
  }
  .pack.new:active{background:var(--panel-2)}
  .pack-actions{display:flex;gap:6px;margin-top:10px}
  .mini-btn{
    flex:1;padding:9px;border-radius:11px;font-size:11.5px;font-weight:800;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    letter-spacing:.3px;
  }
  .mini-btn:active{background:rgba(255,255,255,.13)}
  .mini-btn.danger{color:var(--red);border-color:rgba(248,113,113,.3)}
  .preview{
    margin-top:10px;padding:11px;border-radius:12px;
    background:rgba(0,0,0,.28);border:1px solid var(--border);
    font-size:11px;color:var(--muted);line-height:1.6;max-height:120px;overflow-y:auto;
  }
  .preview .pv-item{display:inline-block;margin:2px 4px 2px 0}
  .preview .pv-item b{color:var(--gold);font-weight:900;margin-left:3px}

  .seg{display:flex;gap:8px}
  .seg.wrap{flex-wrap:wrap}
  .segbtn{
    flex:1;padding:13px 6px;border-radius:13px;font-weight:800;font-size:14px;
    background:var(--panel);border:1px solid var(--border);transition:.15s;
    min-width:52px;color:var(--text);
  }
  .segbtn.sel{
    background:rgba(251,191,36,.14);
    border-color:rgba(251,191,36,.5);
    color:var(--gold);
    box-shadow:0 0 0 1px rgba(251,191,36,.2);
  }
  .names{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .name-input{
    width:100%;padding:13px;border-radius:13px;font-size:14px;font-weight:700;
    background:rgba(0,0,0,.32);border:1px solid var(--border);color:var(--text);
    outline:none;transition:.15s;
  }
  .name-input:focus{border-color:rgba(251,191,36,.5);background:rgba(0,0,0,.4)}
  .name-input::placeholder{color:var(--muted-2)}

  .cash-row{display:flex;align-items:center;justify-content:center;gap:20px}
  .step{
    width:48px;height:48px;border-radius:50%;font-size:22px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:.12s;color:var(--text);
  }
  .step:active{background:rgba(255,255,255,.15);transform:scale(.93)}
  .cash-val{
    font-size:28px;font-weight:900;color:var(--gold);min-width:110px;text-align:center;
    letter-spacing:-.5px;
  }
  .sub-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;font-weight:600;line-height:1.5}
  .sub-hint b{color:var(--gold);font-weight:900}

  /* ============ PACK EDITOR / MODAL ============ */
  .overlay{
    position:fixed;inset:0;z-index:1000;display:none;
    background:rgba(3,3,8,.88);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    overflow-y:auto;padding:20px 14px 44px;
    animation:fade .2s ease;
  }
  .overlay.show{display:block}
  .modal-card{
    max-width:560px;margin:0 auto;
    background:linear-gradient(180deg,#0d0d17,#08080f);
    border:1px solid var(--border-2);border-radius:22px;padding:20px;
    box-shadow:var(--shadow-lg);
  }
  .modal-title{font-size:19px;font-weight:900;letter-spacing:.2px;margin-bottom:5px}
  .modal-sub{font-size:11.5px;color:var(--muted);margin-bottom:18px;font-weight:600;line-height:1.55}

  .field{margin-bottom:16px}
  .field-label{
    font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px;display:block;
  }
  .emoji-row{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .emoji-row::-webkit-scrollbar{display:none}
  .emoji-opt{
    width:42px;height:42px;flex-shrink:0;border-radius:12px;font-size:20px;
    background:var(--panel);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .emoji-opt.sel{
    background:rgba(251,191,36,.18);
    border-color:rgba(251,191,36,.6);
    transform:scale(1.06);
  }
  .editor-input{
    width:100%;padding:13px;border-radius:13px;font-size:14px;font-weight:700;
    background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text);
    outline:none;transition:.15s;
  }
  .editor-input:focus{border-color:rgba(251,191,36,.5)}
  .editor-input::placeholder{color:var(--muted-2);font-weight:600}

  /* ============ ITEM ROWS EDITOR ============ */
  .items-list{
    display:flex;flex-direction:column;gap:7px;
    max-height:340px;overflow-y:auto;
    padding:2px 4px 2px 2px;
    margin:-2px -4px -2px -2px;
  }
  .items-list::-webkit-scrollbar{width:5px}
  .items-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
  .item-row{
    display:grid;
    grid-template-columns:1fr 74px 34px;
    gap:6px;align-items:center;
    animation:slideUp .25s ease;
  }
  .item-name-in{
    width:100%;padding:11px 13px;border-radius:11px;font-size:13.5px;font-weight:700;
    background:rgba(0,0,0,.32);border:1px solid var(--border);color:var(--text);
    outline:none;transition:.15s;min-width:0;
  }
  .item-name-in:focus{border-color:rgba(251,191,36,.5);background:rgba(0,0,0,.45)}
  .item-name-in::placeholder{color:var(--muted-2);font-weight:600}
  .val-wrap{position:relative}
  .val-wrap::before{
    content:'$';position:absolute;left:9px;top:50%;transform:translateY(-50%);
    color:var(--gold);font-size:12.5px;font-weight:900;pointer-events:none;opacity:.85;
  }
  .item-val-in{
    width:100%;padding:11px 8px 11px 20px;border-radius:11px;
    font-size:13.5px;font-weight:900;color:var(--gold);
    background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);
    outline:none;text-align:center;transition:.15s;
    -moz-appearance:textfield;
  }
  .item-val-in:focus{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.13)}
  .item-val-in::-webkit-outer-spin-button,
  .item-val-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .item-del{
    width:34px;height:38px;border-radius:10px;
    background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);
    color:var(--red);font-size:16px;font-weight:900;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .item-del:active{background:rgba(248,113,113,.2);transform:scale(.94)}
  .items-toolbar{display:flex;gap:7px;margin-top:10px}
  .items-toolbar button{
    flex:1;padding:11px;border-radius:11px;font-size:12px;font-weight:800;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    letter-spacing:.3px;
  }
  .items-toolbar button:active{background:rgba(255,255,255,.13)}
  .items-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;color:var(--muted-2);font-weight:800;margin-top:9px;
    letter-spacing:.4px;
  }
  .items-meta b{color:var(--gold);font-weight:900}

  .bulk-area{display:none;margin-top:10px}
  .bulk-area.show{display:block}
  .bulk-area textarea{
    width:100%;min-height:130px;resize:vertical;
    background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;
    padding:12px;color:var(--text);font-size:12.5px;outline:none;
    line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .bulk-area textarea:focus{border-color:rgba(251,191,36,.5)}
  .bulk-hint{font-size:10.5px;color:var(--muted-2);margin:7px 2px 0;font-weight:700;line-height:1.55}
  .bulk-hint code{
    background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;
    color:var(--gold);font-weight:800;
  }

  .modal-actions{display:flex;gap:8px;margin-top:6px}
  .modal-actions .btn-primary{flex:1}

  /* ============ GAME ============ */
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:10px}
  .topic{
    font-size:13px;font-weight:900;letter-spacing:.4px;color:var(--gold);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .counter{font-size:11.5px;color:var(--muted);font-weight:800;flex-shrink:0;letter-spacing:.3px}
  .progress{
    height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;
    margin-bottom:16px;position:relative;
  }
  .progress>div{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,#fbbf24,#f59e0b);
    transition:width .5s cubic-bezier(.3,.9,.4,1);
    box-shadow:0 0 12px rgba(251,191,36,.5);
  }

  .item-card{
    position:relative;
    border-radius:26px;padding:34px 22px;text-align:center;overflow:hidden;
    background:
      linear-gradient(160deg,rgba(251,191,36,.16),rgba(168,85,247,.14) 60%,rgba(96,165,250,.10));
    border:1px solid rgba(251,191,36,.32);
    box-shadow:0 16px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    margin-bottom:12px;
  }
  .item-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);
    background-size:500px 100%;
    animation:shimmer 3.5s linear infinite;
    pointer-events:none;
  }
  .item-label{
    font-size:9.5px;letter-spacing:3px;color:var(--muted);font-weight:900;
    margin-bottom:14px;position:relative;
  }
  .item-name{
    font-size:clamp(22px,6.4vw,32px);font-weight:900;line-height:1.15;
    word-break:break-word;position:relative;letter-spacing:-.6px;
  }
  .item-value{
    margin-top:16px;font-size:11.5px;color:var(--muted);font-weight:800;
    letter-spacing:.5px;position:relative;
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:99px;
    background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);
  }
  .item-value span{color:var(--gold);font-weight:900;letter-spacing:2px}

  .bid-banner{
    text-align:center;padding:13px;border-radius:15px;margin-bottom:12px;
    background:var(--panel);border:1px solid var(--border);font-size:13.5px;
    font-weight:600;transition:.25s;
  }
  .bid-banner strong{color:var(--gold);font-weight:900}
  .bid-banner.empty{color:var(--muted);font-size:12.5px}

  .players{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
    gap:8px;margin-bottom:12px;
  }
  .pcard{
    position:relative;padding:12px 8px 11px;border-radius:16px;text-align:center;
    background:var(--panel);border:1px solid var(--border);transition:.25s;overflow:hidden;
  }
  .pcard.active{
    border-color:rgba(251,191,36,.6);
    background:rgba(251,191,36,.10);
    animation:pulseGold 2s ease-in-out infinite;
  }
  .pcard.folded,.pcard.broke{opacity:.34;filter:grayscale(.5)}
  .p-avatar{
    width:30px;height:30px;border-radius:50%;margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12px;color:#fff;letter-spacing:-.3px;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.2);
  }
  .pname{
    font-size:11.5px;font-weight:800;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px;
  }
  .pmoney{font-size:16px;font-weight:900;color:var(--green);margin-top:3px;letter-spacing:-.3px}
  .pitems{font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:800;letter-spacing:.3px}
  .pbadge{
    position:absolute;top:0;left:0;right:0;font-size:7.5px;font-weight:900;letter-spacing:1px;
    padding:3px 0;text-align:center;text-transform:uppercase;
  }
  .pbadge.high{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1206}
  .pbadge.out,.pbadge.broke{background:rgba(255,255,255,.14);color:var(--muted)}
  .pcard:has(.pbadge) .p-avatar{margin-top:8px}

  .controls{
    background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s =>
    s.classList.toggle('active', s.id === 'screen-' + name)
  );

}
function uid(){ return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function initialsOf(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function colorFor(seed){
  let h = 0;
  for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;

  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';

function loadLocalPacks(){
  try {
    const raw = localStorage.getItem(PACKS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) return [];
    return arr
      .filter(p => p && p.id && Array.isArray(p.items))
      .map(p => ({
        id: p.id,
        name: String(p.name || 'Untitled'),
        emoji: p.emoji || '✨',
        items: p.items
          .map(it => ({
            name: String((it && it.name) || '').trim(),
            value: clamp(parseInt(it && it.value, 10) || 1, 1, 99)
          }))
          .filter(it => it.name)
      }))
      .filter(p => p.items.length >= 1);
  } catch(e){ return []; }
}
function saveLocalPacks(packs){
  try { localStorage.setItem(PACKS_KEY, JSON.stringify(packs)); } catch(e){}
}
function loadLocalProfile(){
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;

    cloud.auth = authMod.getAuth(app);
    cloud.db   = dbMod.getFirestore(app);
    cloud.fb   = { authMod, dbMod };

    authMod.onAuthStateChanged(cloud.auth, async user => {
      cloud.user = user;
      cloud.ready = true;
      if (user){
        await loadUserProfile();
        await pullCloudPacks();
      } else {
        cloud.profile = loadLocalProfile();
      }
      renderHeader();
      if ($('screen-setup').classList.contains('active')) renderSetup();
      if ($('screen-leaderboard').classList.contains('active')) renderLeaderboard();
    });
  } catch(e){
    console.warn('[AuctionWars] Firebase init failed:', e);
    cloud.ready = true;
    renderHeader();
    toast('Cloud init failed — check console', 'error');
  }
}

    console.warn(e);

    if (e && e.code === 'auth/unauthorized-domain') msg = 'Domain not authorized in Firebase';
    if (e && e.code === 'auth/popup-blocked') msg = 'Popup blocked — allow popups';
    if (e && e.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';

async function pullCloudPacks(){
  if (!cloud.user) return;
  try {
    const col = cloud.fb.dbMod.collection(cloud.db, 'users', cloud.user.uid, 'packs');
    const snap = await cloud.fb.dbMod.getDocs(col);
    const list = [];
    snap.forEach(d => {
      const data = d.data();
      const items = Array.isArray(data.items) ? data.items.map(it => ({
        name: String(it.name || '').trim(),
        value: clamp(parseInt(it.value, 10) || 1, 1, 99)
      })).filter(it => it.name) : [];
      if (items.length){
        list.push({
          id: d.id,
          name: String(data.name || 'Untitled'),
          emoji: data.emoji || '✨',
          items
        });
      }
    });
    if (list.length){
      setup.customPacks = list;
      saveLocalPacks(list);
    }
  } catch(e){
    console.warn('pack pull failed', e);
  }
}

/* ---------- Elo ---------- */
function computeElo(players, K){
  K = K || 32;
  const n = players.length;
  const deltas = players.map(() => 0);
  if (n < 2) return deltas;
  for (let i = 0; i < n; i++){
    for (let j = 0; j < n; j++){
      if (i === j) continue;
      const Ra = players[i].rating, Rb = players[j].rating;
      const Ea = 1 / (1 + Math.pow(10, (Rb - Ra) / 400));
      let Sa = 0.5;
      if (players[i].placement < players[j].placement) Sa = 1;
      else if (players[i].placement > players[j].placement) Sa = 0;
      deltas[i] += (K / (n - 1)) * (Sa - Ea);
    }
  }
  return deltas.map(d => Math.round(d));
}

async function recordGameResult(rankedPlayers){
  if (!cloud.enabled || !cloud.user || !cloud.profile){
    return null;
  }
  const myProfile = cloud.profile;
  const myRating = myProfile.elo || 1000;
  const others = rankedPlayers.filter(p => !p.isYou);
  const base = others.length ? Math.round(others.reduce((s, p) => s + (p.rating || 1000), 0) / others.length) : 1000;

  const participants = rankedPlayers.map(p => ({
    rating: p.isYou ? myRating : (p.rating || base),
    placement: p.placement
  }));
  const deltas = computeElo(participants, 32);
  const myIdx = rankedPlayers.findIndex(p => p.isYou);
  const delta = myIdx >= 0 ? deltas[myIdx] : 0;

  const newElo = clamp(myRating + delta, 100, 4000);
  const won = myIdx === 0;

  const updated = {
    ...myProfile,
    elo: newElo,
    wins: (myProfile.wins || 0) + (won ? 1 : 0),
    games: (myProfile.games || 0) + 1,
    totalValue: (myProfile.totalValue || 0) + (rankedPlayers[myIdx] ? rankedPlayers[myIdx].total : 0),
    updatedAt: Date.now()
  };
  cloud.profile = updated;
  saveLocalProfile(updated);

  try {
    const ref = cloud.fb.dbMod.doc(cloud.db, 'users', cloud.user.uid);
    await cloud.fb.dbMod.setDoc(ref, updated, { merge: true });
  } catch(e){ console.warn('elo save failed', e); }

  return { delta, newElo, oldElo: myRating };
}

async function fetchLeaderboard(){
  if (!cloud.enabled || !cloud.db) return null;
  try {
    const col = cloud.fb.dbMod.collection(cloud.db, 'users');
    const q = cloud.fb.dbMod.query(col, cloud.fb.dbMod.orderBy('elo', 'desc'), cloud.fb.dbMod.limit(50));
    const snap = await cloud.fb.dbMod.getDocs(q);
    const list = [];
    snap.forEach(d => {
      const data = d.data();
      list.push({
        uid: d.id,
        name: data.displayName || 'Player',
        photoURL: data.photoURL || '',
        elo: data.elo || 1000,
        wins: data.wins || 0,
        games: data.games || 0,
        totalValue: data.totalValue || 0
      });
    });
    return list;
  } catch(e){
    console.warn('leaderboard fetch failed', e);
    return null;
  }
}

function parseBulk(text){
  const out = [];
  String(text).split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    let name = line, val = 5;
    let m;
    if ((m = line.match(/^(.+?)\s*\|\s*(-?\d+)\s*$/))){
      name = m[1].trim(); val = parseInt(m[2], 10);
    } else if ((m = line.match(/^(.+?)\s*[,:]\s*(-?\d+)\s*$/))){
      name = m[1].trim(); val = parseInt(m[2], 10);
    }
    name = name.replace(/^[-•*]\s*/, '').trim();
    if (!name) return;
    out.push({ name, value: clamp(isNaN(val) ? 5 : val, 1, 99) });
  });
  return out;
}

  list.innerHTML = editor.items.map((it, i) => `
    <div class="item-row" data-idx="${i}">
      <input class="item-name-in" maxlength="40" placeholder="Item name"
             value="${esc(it.name)}" data-i="${i}">
      <div class="val-wrap">
        <input class="item-val-in" type="number" min="1" max="99" inputmode="numeric"
               value="${it.value}" data-i="${i}">
      </div>
      <button class="item-del" data-i="${i}" title="Remove">×</button>
    </div>
  `).join('');

  list.querySelectorAll('.item-name-in').forEach(inp => {
    inp.addEventListener('input', e => {
      editor.items[+e.target.dataset.i].name = e.target.value;
      updateEditorMeta();
    });
  });
  list.querySelectorAll('.item-val-in').forEach(inp => {
    inp.addEventListener('input', e => {
      const v = clamp(parseInt(e.target.value, 10) || 1, 1, 99);
      editor.items[+e.target.dataset.i].value = v;
      updateEditorMeta();
    });
    inp.addEventListener('blur', e => {
      const v = clamp(parseInt(e.target.value, 10) || 1, 1, 99);
      e.target.value = v;
      editor.items[+e.target.dataset.i].value = v;
      updateEditorMeta();
    });
  });
  list.querySelectorAll('.item-del').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = +e.target.dataset.i;
      if (editor.items.length <= 1){
        editor.items = [{ name: '', value: 5 }];
      } else {
        editor.items.splice(i, 1);
      }
      renderItemRows();
    });
  });

  updateEditorMeta();
}

function updateEditorMeta(){
  const countEl = $('itemCount');
  const totalEl = $('totalValue');
  if (!countEl || !totalEl) return;
  const valid = editor.items.filter(it => it.name.trim());
  countEl.textContent = valid.length;
  totalEl.textContent = valid.reduce((s, it) => s + it.value, 0);
}

$('packEditor').addEventListener('click', e => {
  const emojiBtn = e.target.closest('[data-emoji]');
  if (emojiBtn){
    editor.emoji = emojiBtn.dataset.emoji;
    $('packEditor').querySelectorAll('.emoji-opt').forEach(b =>
      b.classList.toggle('sel', b.dataset.emoji === editor.emoji)
    );
    return;
  }

  const action = e.target.closest('[data-ed]');
  if (!action) return;

  if (action.dataset.ed === 'cancel'){ closeEditor(); return; }

  if (action.dataset.ed === 'save'){
    const name = editor.name.trim();
    const items = editor.items
      .map(it => ({ name: it.name.trim(), value: clamp(it.value, 1, 99) }))
      .filter(it => it.name);

    if (!name){ toast('Give your pack a name', 'error'); return; }
    if (items.length < 2){ toast('Add at least 2 items', 'error'); return; }

    if (editor.id){
      const p = setup.customPacks.find(x => x.id === editor.id);
      if (p){ p.name = name; p.emoji = editor.emoji; p.items = items; }
      pushPackToCloud(p || { id: editor.id, name, emoji: editor.emoji, items });
    } else {
      const newPack = { id: 'custom_' + uid(), name, emoji: editor.emoji, items };
      setup.customPacks.push(newPack);
      setup.packId = newPack.id;
      pushPackToCloud(newPack);
    }
    saveLocalPacks(setup.customPacks);
    closeEditor();
    renderSetup();
    toast('Pack saved', 'success');
    return;
  }

  if (action.dataset.ed === 'delete'){
    if (!confirm('Delete this pack? This cannot be undone.')) return;
    setup.customPacks = setup.customPacks.filter(p => p.id !== editor.id);
    saveLocalPacks(setup.customPacks);
    deletePackFromCloud(editor.id);
    if (setup.packId === editor.id) setup.packId = Object.keys(PACKS)[0];
    closeEditor();
    renderSetup();
    toast('Pack deleted');
  }
});

/* ============================================================================
   GAME STATE
   ========================================================================== */
const state = {
  topicName: '',
  players: [],
  items: [],
  idx: 0,
  currentBid: 0,
  highBidder: null,
  turn: 0,
  pendingBid: 1,
  locked: false,
  eloResult: null
};

/* ============================================================================
   START GAME
   ========================================================================== */
function startGame(){
  const pool = getSelectedItems();
  if (pool.length < 2){ toast('This pack needs at least 2 items', 'error'); return; }

  const count = Math.min(setup.itemCount, pool.length);
  const chosen = shuffle(pool).slice(0, count);

  state.items = chosen.map(it => ({
    name: it.name,
    value: it.value,
    winner: null,
    price: null
  }));
  state.topicName = getSelectedLabel();
  state.players = Array.from({ length: setup.playerCount }, (_, i) => ({
    id: i,
    name: (setup.names[i] || '').trim() || ('Player ' + (i + 1)),
    money: setup.cash,
    startCash: setup.cash,
    items: [],
    inRound: true
  }));
  state.idx = 0;
  state.locked = false;
  state.eloResult = null;

  showScreen('game');
  startItem();
}

/* ============================================================================
   ITEM FLOW
   ========================================================================== */
function startItem(){
  state.currentBid = 0;
  state.highBidder = null;
  state.locked = false;

  state.players.forEach(p => { p.inRound = p.money > 0; });

  const n = state.players.length;
  const start = state.idx % n;
  let found = -1;
  for (let k = 0; k < n; k++){
    const j = (start + k) % n;
    if (state.players[j].inRound){ found = j; break; }
  }
  state.turn = found;

  if (found === -1){ resolveItem(); return; }

  state.pendingBid = Math.min(state.currentBid + 1, state.players[found].money);
  renderGame();
}

function advanceTurn(){
  const n = state.players.length;
  for (let k = 1; k <= n; k++){
    const j = (state.turn + k) % n;
    if (state.players[j].inRound){ state.turn = j; return; }
  }
}

function afterAction(){
  const remaining = state.players.filter(p => p.inRound);
  if (remaining.length <= 1){ resolveItem(); return; }

  advanceTurn();
  const cur = state.players[state.turn];
  state.pendingBid = Math.min(state.currentBid + 1, cur.money);
  renderGame();
}

function resolveItem(){
  const item = state.items[state.idx];
  const remaining = state.players.filter(p => p.inRound);

  let winner = null;
  let price = 0;

  if (remaining.length === 1 &&
      state.highBidder !== null &&
      remaining[0].id === state.highBidder){
    winner = remaining[0];
    price = state.currentBid;
  }

  if (winner){
    winner.money -= price;
    winner.items.push({ name: item.name, value: item.value, price });
    item.winner = winner.id;
    item.price = price;
  }

  state.locked = true;
  showFlash(item, winner, price);

  setTimeout(() => {
    state.idx++;
    const solvent = state.players.filter(p => p.money > 0).length;
    if (state.idx >= state.items.length || solvent <= 1){
      endGame();
    } else {
      startItem();
    }
  }, 1550);
}

/* ============================================================================
   GAME RENDER
   ========================================================================== */
function renderGame(){
  const g = $('screen-game');
  const item = state.items[state.idx];
  const total = state.items.length;
  const cur = state.players[state.turn];

  const minB = state.currentBid + 1;
  const maxB = cur ? cur.money : 0;
  const canBid = cur && maxB >= minB;

  if (canBid){
    state.pendingBid = clamp(state.pendingBid, minB, maxB);
  }

  g.innerHTML = `
    <div class="topbar">
      <div class="topic">${esc(state.topicName)}</div>
      <div class="counter">Item ${state.idx + 1} / ${total}</div>
    </div>
    <div class="progress"><div style="width:${(state.idx / total) * 100}%"></div></div>

    <div class="item-card">
      <div class="item-label">ON THE BLOCK</div>
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-value">Hidden value <span>? ? ?</span></div>
    </div>

    <div class="bid-banner ${state.highBidder === null ? 'empty' : ''}">
      ${state.highBidder === null
        ? 'No bids yet — opening at $1'
        : `Current bid <strong>$${state.currentBid}</strong> by <strong>${esc(state.players[state.highBidder].name)}</strong>`}
    </div>

    <div class="players">
      ${state.players.map((p, i) => {
        const badge = (i === state.highBidder)
          ? '<div class="pbadge high">HIGH BID</div>'
          : (p.money <= 0)
            ? '<div class="pbadge broke">BROKE</div>'
            : (!p.inRound ? '<div class="pbadge out">OUT</div>' : '');
        return `
          <div class="pcard ${i === state.turn ? 'active' : ''} ${(!p.inRound && p.money > 0) ? 'folded' : ''} ${p.money <= 0 ? 'broke' : ''}">
            ${badge}
            <div class="p-avatar" style="background:${colorFor(p.name)}">${esc(initialsOf(p.name))}</div>
            <div class="pname">${esc(p.name)}</div>
            <div class="pmoney">$${p.money}</div>
            <div class="pitems">${p.items.length} item${p.items.length === 1 ? '' : 's'}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="controls">
      <div class="turn-line">${cur ? `<strong>${esc(cur.name)}</strong>, your move` : ''}</div>

      ${canBid ? `
        <div class="bid-row">
          <button class="step" data-action="dec">−</button>
          <div class="bid-amount">$${state.pendingBid}</div>
          <button class="step" data-action="inc">+</button>
        </div>
        <div class="quick">
          <button data-action="quick" data-v="1">+$1</button>
          <button data-action="quick" data-v="5">+$5</button>
          <button data-action="quick" data-v="all">ALL IN</button>
        </div>
        <button class="btn-bid" data-action="bid">BID $${state.pendingBid}</button>
      ` : `
        <div class="cant">You can't cover the minimum bid of $${minB}</div>
      `}

      <button class="btn-fold" data-action="fold">Fold</button>
    </div>
  `;
}

$('screen-game').addEventListener('click', e => {
  if (state.locked) return;
  const btn = e.target.closest('[data-action]');
  if (!btn) return;

  const cur = state.players[state.turn];
  if (!cur) return;

  const minB = state.currentBid + 1;
  const maxB = cur.money;

  switch (btn.dataset.action){
    case 'inc':
      state.pendingBid = Math.min(state.pendingBid + 1, maxB);
      renderGame();
      break;

    case 'dec':
      state.pendingBid = Math.max(state.pendingBid - 1, minB);
      renderGame();
      break;

    case 'quick': {
      const v = btn.dataset.v;
      if (v === 'all') state.pendingBid = maxB;
      else state.pendingBid = clamp(state.pendingBid + (+v), minB, maxB);
      renderGame();
      break;
    }

    case 'bid': {
      const amt = state.pendingBid;
      if (amt <= state.currentBid || amt > cur.money) return;
      state.currentBid = amt;
      state.highBidder = cur.id;
      afterAction();
      break;
    }

    case 'fold':
      cur.inRound = false;
      afterAction();
      break;
  }
});

/* ============================================================================
   FLASH OVERLAY
   ========================================================================== */
function showFlash(item, winner, price){
  const el = document.createElement('div');
  el.className = 'flash';

  let body;
  if (winner){
    const profit = item.value - price;
    const cls = profit >= 0 ? 'pos' : 'neg';
    const sign = profit >= 0 ? '+' : '−';
    body = `
      <div class="flash-inner">
        <div class="flash-sold">SOLD!</div>
        <div class="flash-item">${esc(item.name)}</div>
        <div class="flash-price">${esc(winner.name)} pays $${price}</div>
        <div class="flash-profit ${cls}">Value ${item.value} · ${sign}$${Math.abs(profit)}</div>
      </div>`;
  } else {
    body = `
      <div class="flash-inner">
        <div class="flash-sold unsold">NO SALE</div>
        <div class="flash-item">${esc(item.name)}</div>
        <div class="flash-price">Everyone folded · value was ${item.value}</div>
      </div>`;
  }
  el.innerHTML = body;

  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 1350);
}

/* ============================================================================
   END GAME / RESULTS
   ========================================================================== */
async function endGame(){
  state.locked = true;

  const meId = cloud.user ? 0 : -1;
  const ranked = state.players.map((p, i) => ({
    name: p.name,
    money: p.money,
    items: p.items,
    total: p.items.reduce((s, it) => s + it.value, 0),
    spent: p.items.reduce((s, it) => s + it.price, 0),
    isYou: cloud.user && i === meId,
    rating: 1000
  })).sort((a, b) => (b.total - a.total) || (b.money - a.money));

  ranked.forEach((r, i) => r.placement = i);

  let eloResult = null;
  if (cloud.user && cloud.profile){
    eloResult = await recordGameResult(ranked);
    state.eloResult = eloResult;
  }

  renderResults(ranked, eloResult);
  showScreen('results');
}

function renderResults(ranked, eloResult){
  const top = ranked[0];
  const tie = ranked.length > 1 &&
              ranked[1].total === top.total &&
              ranked[1].money === top.money;

  const medals = ['🥇','🥈','🥉','4️⃣'];
  const unsold = state.items.filter(it => it.winner === null);
  const youRow = ranked.find(r => r.isYou);

  let eloBlock = '';
  if (eloResult && youRow){
    const up = eloResult.delta >= 0;
    eloBlock = `
      <div class="elo-change">
        <span>Elo ${eloResult.oldElo} → <b>${eloResult.newElo}</b></span>
        <span class="elo-delta ${up ? 'up' : 'down'}">${up ? '+' : ''}${eloResult.delta}</span>
      </div>
    `;
  } else if (cloud.enabled && !cloud.user){
    eloBlock = `
      <div class="elo-change" style="cursor:pointer;opacity:.85" id="signInForElo">
        <span>Sign in to record your rating</span>
      </div>
    `;
  }

  $('screen-results').innerHTML = `
    <div class="winner-box">
      <div class="crown">${tie ? '🤝' : '👑'}</div>
      <div class="wlabel">${tie ? 'DEAD HEAT' : 'WINNER'}</div>
      <div class="wname">${esc(top.name)}</div>
      <div class="wsub">${top.total} total value · $${top.money} left</div>
      ${eloBlock}
    </div>

    <div class="rank-list">
      ${ranked.map((r, i) => `
        <div class="rank-row ${i === 0 ? 'first' : ''}">
          <div class="rank-head">
            <span class="medal">${medals[i] || ''}</span>
            <span class="rname">${esc(r.name)}${r.isYou ? ' <span style="color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.5px">· YOU</span>' : ''}</span>
            <span class="rval">${r.total} pts</span>
          </div>
          <div class="rline">$${r.money} left · spent $${r.spent} · ${r.items.length} item${r.items.length === 1 ? '' : 's'}</div>
          <div class="ritems">
            ${r.items.length
              ? r.items.map(it => {
                  const profit = it.value - it.price;
                  const cls = profit >= 0 ? 'profit' : 'loss';
                  const sign = profit >= 0 ? '+' : '−';
                  return `<span class="chip">${esc(it.name)} <b>${it.value}</b>
                          <span class="paid ${cls}">${sign}$${Math.abs(profit)}</span></span>`;
                }).join('')
              : '<span class="muted" style="font-size:11px;font-weight:700">bought nothing 😬</span>'}
          </div>
        </div>
      `).join('')}
    </div>

    ${unsold.length ? `
      <div class="panel">
        <div class="label">Went unsold</div>
        <div class="ritems" style="margin-left:0">
          ${unsold.map(it => `<span class="chip">${esc(it.name)} <b>${it.value}</b></span>`).join('')}
        </div>
      </div>
    ` : ''}

    <button class="btn-primary" id="againBtn">Play Again</button>
    <button class="btn-secondary" id="lbFromResults" style="margin-top:8px">View Leaderboard</button>
  `;

  $('againBtn').addEventListener('click', () => {
    renderSetup();
    showScreen('setup');
    renderHeader();
  });
  $('lbFromResults').addEventListener('click', () => {
    renderLeaderboard();
    showScreen('leaderboard');
    renderHeader();
  });
  const signInLink = $('signInForElo');
  if (signInLink) signInLink.addEventListener('click', signIn);
}

/* ============================================================================
   LEADERBOARD
   ========================================================================== */
async function renderLeaderboard(){
  const el = $('screen-leaderboard');

  el.innerHTML = `
    <div class="lb-header">
      <h2>Leaderboard</h2>
      <p>${cloud.enabled
        ? (cloud.user ? 'Global Elo rankings' : 'Sign in to appear on the board')
        : 'Cloud not configured — local stats only'}</p>
    </div>
    <div class="empty-state" id="lbLoading">
      <span class="big">⏳</span>
      Loading rankings…
    </div>
    <button class="btn-secondary" id="lbBack">Back</button>
  `;
  $('lbBack').addEventListener('click', () => {
    renderSetup();
    showScreen('setup');
    renderHeader();
  });

  let list = null;
  if (cloud.enabled && cloud.db){
    list = await fetchLeaderboard();
  }

  if (!list || !list.length){
    const local = cloud.profile || loadLocalProfile();
    if (local && local.elo){
      list = [{
        uid: 'local',
        name: local.displayName || 'You',
        photoURL: local.photoURL || '',
        elo: local.elo || 1000,
        wins: local.wins || 0,
        games: local.games || 0,
        totalValue: local.totalValue || 0
      }];
    } else {
      list = [];
    }
  }

  const myUid = cloud.user ? cloud.user.uid : 'local';

  if (!list.length){
    el.innerHTML = `
      <div class="lb-header"><h2>Leaderboard</h2><p>No games recorded yet</p></div>
      <div class="empty-state">
        <span class="big">🏆</span>
        Play a game and sign in to claim the top spot.
      </div>
      <button class="btn-secondary" id="lbBack2">Back</button>
    `;
    $('lbBack2').addEventListener('click', () => {
      renderSetup();
      showScreen('setup');
      renderHeader();
    });
    return;
  }

  el.innerHTML = `
    <div class="lb-header">
      <h2>Leaderboard</h2>
      <p>${cloud.enabled && cloud.user ? 'Global Elo rankings' : (cloud.enabled ? 'Sign in to appear on the board' : 'Local stats only')}</p>
    </div>
    <div class="lb-list">
      ${list.map((u, i) => {
        const rank = i + 1;
        const rankCls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const isMe = u.uid === myUid;
        return `
          <div class="lb-row ${isMe ? 'me' : ''}">
            <div class="lb-rank ${rankCls}">${medal}</div>
            ${avatarHTML(u.name, u.photoURL, 38)}
            <div class="lb-info">
              <div class="lb-name">${esc(u.name)}${isMe ? ' <span style="color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.6px">· YOU</span>' : ''}</div>
              <div class="lb-stats">${u.wins}W · ${u.games}G · ${u.totalValue} total value</div>
            </div>
            <div class="lb-elo">${u.elo}<small>ELO</small></div>
          </div>
        `;
      }).join('')}
    </div>
    <button class="btn-secondary" id="lbBack3">Back</button>
  `;
  $('lbBack3').addEventListener('click', () => {
    renderSetup();
    showScreen('setup');
    renderHeader();
  });
}

   BOOT

renderSetup();
renderHeader();
initCloud();
