<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Auction Wars</title>
<style>
  :root{
    --bg:#08080f;
    --surface:#0f0f1a;
    --surface-2:#14141f;
    --surface-3:#1a1a26;
    --border:rgba(255,255,255,.07);
    --border-2:rgba(255,255,255,.12);
    --gold:#fbbf24;
    --gold-bright:#fcd34d;
    --gold-deep:#b45309;
    --green:#34d399;
    --red:#f87171;
    --purple:#a78bfa;
    --blue:#60a5fa;
    --text:#f4f4f7;
    --text-2:#b8b8c5;
    --muted:#8a8a99;
    --muted-2:#5f5f6e;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 24px rgba(0,0,0,.35);
    --shadow-lg:0 20px 50px rgba(0,0,0,.55);
    --shadow-gold:0 10px 30px rgba(251,191,36,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);
    background-image:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(251,191,36,.07), transparent 60%),
      radial-gradient(circle at 0% 0%, rgba(99,102,241,.10) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(168,85,247,.08) 0%, transparent 45%);
    background-attachment:fixed;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","cv11";
    display:flex;justify-content:center;padding:14px 12px 40px;min-height:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  .app{width:100%;max-width:540px;display:flex;flex-direction:column;gap:0}
  .screen{display:none;animation:screenIn .28s cubic-bezier(.2,.7,.3,1)}
  .screen.active{display:block}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}
    50%{box-shadow:0 0 0 6px rgba(52,211,153,0)}
  }
  @keyframes pulseGold{
    0%,100%{box-shadow:0 0 0 1px rgba(251,191,36,.4), 0 0 24px rgba(251,191,36,.15)}
    50%{box-shadow:0 0 0 1px rgba(251,191,36,.7), 0 0 32px rgba(251,191,36,.28)}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea,select{font-family:inherit}
  ::selection{background:rgba(251,191,36,.28);color:#fff}
  input::placeholder,textarea::placeholder{color:var(--muted-2)}

  /* ============ HEADER ============ */
  .app-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:2px 2px 18px;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{
    width:40px;height:40px;border-radius:13px;flex-shrink:0;
    background:linear-gradient(145deg,#fde68a,#fbbf24 40%,#d97706);
    box-shadow:
      0 6px 20px rgba(251,191,36,.35),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -1px 0 rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;color:#1a1206;letter-spacing:-.5px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.05;gap:3px}
  .brand-name{font-size:15.5px;font-weight:900;letter-spacing:-.1px}
  .brand-sub{font-size:9px;color:var(--muted-2);font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.07);border-color:var(--border-2)}
  .icon-btn:active{transform:scale(.95)}
  .icon-btn.active{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.45);color:var(--gold)}
  .user-chip{
    display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);transition:.15s;
    max-width:170px;
  }
  .user-chip:hover{background:rgba(255,255,255,.07);border-color:var(--border-2)}
  .user-chip:active{transform:scale(.98)}
  .user-avatar{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,#a78bfa,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:#fff;overflow:hidden;letter-spacing:-.3px;
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.2);
  }
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
  .user-name small{font-size:9px;color:var(--muted-2);font-weight:800;letter-spacing:.6px;margin-left:5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .signin-btn{
    display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;
    background:linear-gradient(135deg,#ffffff,#e4e4ed);color:#111117;
    font-size:12px;font-weight:800;letter-spacing:-.05px;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 -1px 0 rgba(0,0,0,.1);
    transition:.15s;
  }
  .signin-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .signin-btn:active{transform:translateY(0) scale(.98)}

  /* ============ CARDS / PANELS ============ */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:14px;
  }
  .panel-title{
    font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;
    color:var(--text-2);
    display:flex;align-items:center;gap:8px;
  }
  .panel-title .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;
    background:rgba(251,191,36,.14);color:var(--gold);
    font-size:9.5px;font-weight:900;
  }
  .panel-hint{font-size:10.5px;color:var(--muted-2);font-weight:700;letter-spacing:.2px}

  /* ============ BUTTONS ============ */
  .btn-primary{
    width:100%;padding:16px;border-radius:16px;font-size:14.5px;font-weight:900;letter-spacing:1.2px;
    background:linear-gradient(135deg,#fcd34d,#fbbf24 40%,#f59e0b);
    color:#1a1206;
    box-shadow:var(--shadow-gold), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s, box-shadow .2s;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:hover{box-shadow:0 14px 34px rgba(251,191,36,.3), inset 0 1px 0 rgba(255,255,255,.5)}
  .btn-primary:active{transform:scale(.985)}
  .btn-primary:disabled{opacity:.32;box-shadow:none;pointer-events:none;filter:grayscale(.5)}
  .btn-secondary{
    width:100%;padding:14px;border-radius:14px;font-size:13.5px;font-weight:800;letter-spacing:.4px;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);color:var(--text);
    transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-secondary:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
  .btn-secondary:active{transform:scale(.985)}
  .btn-ghost{
    padding:13px 16px;border-radius:14px;font-size:13px;font-weight:800;letter-spacing:.3px;
    background:transparent;border:1px solid var(--border);color:var(--text-2);
    transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.05);color:var(--text);border-color:var(--border-2)}
  .btn-danger{
    color:var(--red);border-color:rgba(248,113,113,.3);
  }
  .btn-danger:hover{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.5)}
  .btn-sm{
    padding:9px 13px;border-radius:11px;font-size:11.5px;font-weight:800;letter-spacing:.3px;
  }
  .rules{
    color:var(--muted);font-size:11.5px;text-align:center;line-height:1.7;
    margin:16px 6px 0;font-weight:600;
  }
  .muted{color:var(--muted)}
  .muted-2{color:var(--muted-2)}

  /* ============ HERO ============ */
  .hero{text-align:center;padding:6px 0 22px}
  .hero h1{
    margin:0;font-size:40px;font-weight:900;letter-spacing:-1.4px;line-height:1;
  }
  .hero h1 span{
    background:linear-gradient(100deg,#fde68a 0%,#fbbf24 45%,#f59e0b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 12px rgba(251,191,36,.25));
  }
  .hero p{color:var(--muted);font-size:13px;margin:10px 0 0;font-weight:600;letter-spacing:.1px}

  /* ============ CLOUD BANNER ============ */
  .banner{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 14px;border-radius:14px;
    background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.2);
    font-size:11.5px;font-weight:700;color:#bfd4f5;margin-bottom:12px;line-height:1.55;
  }
  .banner.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.22);color:#f3d99b}
  .banner.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.22);color:#a7f3d0}
  .banner.danger{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.25);color:#fecaca}
  .banner .icon{font-size:15px;flex-shrink:0;line-height:1.4}
  .banner b{color:var(--gold);font-weight:900}

  /* ============ PACK GRID ============ */
  .pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack{
    position:relative;padding:13px 12px;border-radius:14px;
    font-size:12.5px;font-weight:800;
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    color:var(--text);transition:.15s;text-align:left;
    display:flex;flex-direction:column;gap:5px;line-height:1.3;
    overflow:hidden;
  }
  .pack:hover{background:rgba(255,255,255,.06);border-color:var(--border-2)}
  .pack.sel{
    background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(251,191,36,.06));
    border-color:rgba(251,191,36,.55);
    color:var(--gold);
    box-shadow:0 0 0 1px rgba(251,191,36,.2), 0 6px 20px rgba(251,191,36,.1);
  }
  .pack .pname{display:block;position:relative;letter-spacing:-.1px}
  .pack .pcount{
    font-size:9.5px;font-weight:800;color:var(--muted-2);letter-spacing:.5px;
    display:flex;align-items:center;gap:5px;
  }
  .pack.sel .pcount{color:rgba(251,191,36,.75)}
  .pack .ownertag{
    display:inline-flex;align-items:center;
    font-size:8.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
    padding:2px 6px;border-radius:99px;
    background:rgba(167,139,250,.15);color:#c4b5fd;
    width:fit-content;
  }
  .pack.new{
    border-style:dashed;border-color:rgba(255,255,255,.14);
    align-items:center;justify-content:center;text-align:center;
    color:var(--muted);font-weight:900;letter-spacing:.4px;
    min-height:62px;flex-direction:row;gap:7px;
  }
  .pack.new:hover{background:rgba(255,255,255,.05);color:var(--text-2)}

  .pack-actions{display:flex;gap:6px;margin-top:12px}
  .pack-actions .btn-ghost{flex:1;padding:10px;font-size:11.5px}

  /* ============ PLAYER ROWS / COMPETITORS ============ */
  .competitors{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .comp-row{
    display:flex;align-items:center;gap:11px;
    padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    transition:.15s;
  }
  .comp-row.you{
    background:linear-gradient(135deg,rgba(251,191,36,.09),rgba(251,191,36,.03));
    border-color:rgba(251,191,36,.3);
  }
  .comp-avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;color:#fff;overflow:hidden;letter-spacing:-.2px;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.22);
  }
  .comp-avatar img{width:100%;height:100%;object-fit:cover}
  .comp-info{flex:1;min-width:0}
  .comp-name{
    font-size:13.5px;font-weight:800;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:7px;
  }
  .comp-meta{
    font-size:10px;color:var(--muted-2);font-weight:800;
    margin-top:3px;letter-spacing:.3px;
    display:flex;align-items:center;gap:7px;
  }
  .comp-meta .pid{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.8px;color:var(--gold);font-weight:900;
    opacity:.8;
  }
  .comp-remove{
    width:28px;height:28px;border-radius:9px;flex-shrink:0;
    background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);
    color:var(--red);font-size:15px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .comp-remove:hover{background:rgba(248,113,113,.18)}
  .comp-remove:active{transform:scale(.93)}

  .add-comp{
    width:100%;padding:14px;border-radius:14px;
    background:rgba(255,255,255,.02);
    border:1.5px dashed rgba(255,255,255,.16);
    color:var(--muted);font-size:12.5px;font-weight:800;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:.15s;
  }
  .add-comp:hover{
    background:rgba(251,191,36,.04);border-color:rgba(251,191,36,.35);
    color:var(--gold);
  }
  .add-comp:disabled{opacity:.35;pointer-events:none;border-style:solid}

  .online-dot{
    width:8px;height:8px;border-radius:50%;background:var(--green);
    flex-shrink:0;animation:pulseDot 2.4s ease-in-out infinite;
  }
  .online-dot.away{background:var(--gold);animation:none}
  .online-dot.offline{background:var(--muted-2);animation:none}

  /* ============ SETUP FOOTER ============ */
  .setup-summary{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
    background:rgba(0,0,0,.25);border:1px solid var(--border);margin-top:2px;
    font-size:11.5px;font-weight:700;color:var(--muted);
  }
  .setup-summary .v{color:var(--gold);font-weight:900}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* ============ SEGMENTED CONTROLS ============ */
  .seg{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px;border:1px solid var(--border)}
  .seg.wrap{flex-wrap:wrap}
  .segbtn{
    flex:1;padding:11px 6px;border-radius:10px;font-weight:800;font-size:13px;
    background:transparent;color:var(--muted);transition:.15s;
    min-width:44px;letter-spacing:.2px;
  }
  .segbtn:hover{color:var(--text-2)}
  .segbtn.sel{
    background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(251,191,36,.1));
    color:var(--gold);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 4px 12px rgba(251,191,36,.15);
  }

  .stepper{display:flex;align-items:center;justify-content:center;gap:18px}
  .step{
    width:46px;height:46px;border-radius:14px;font-size:20px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:.12s;color:var(--text);
  }
  .step:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
  .step:active{transform:scale(.94)}
  .step-val{
    font-size:28px;font-weight:900;color:var(--gold);min-width:104px;text-align:center;
    letter-spacing:-1px;line-height:1;
  }

  /* ============ LOBBY / PLAYING WITH ============ */
  .lobby-wrap{text-align:center;padding:24px 0 12px}
  .lobby-icon{
    width:78px;height:78px;border-radius:50%;margin:0 auto 20px;
    background:radial-gradient(circle at 50% 30%, rgba(251,191,36,.28), rgba(251,191,36,.06));
    border:1px solid rgba(251,191,36,.35);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    box-shadow:0 12px 40px rgba(251,191,36,.2), inset 0 1px 0 rgba(255,255,255,.1);
    animation:pulseGold 3s ease-in-out infinite;
  }
  .lobby-title{font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1.15}
  .lobby-sub{color:var(--muted);font-size:12.5px;margin-top:8px;font-weight:600;line-height:1.6}
  .lobby-players{
    display:flex;flex-direction:column;gap:8px;margin:22px 0 16px;text-align:left;
  }
  .lobby-row{
    display:flex;align-items:center;gap:11px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
  }
  .lobby-row.host{border-color:rgba(251,191,36,.28);background:linear-gradient(135deg,rgba(251,191,36,.07),rgba(251,191,36,.02))}
  .lobby-row .badge{
    font-size:8.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;
    background:rgba(251,191,36,.15);color:var(--gold);flex-shrink:0;
  }
  .lobby-note{
    font-size:11.5px;color:var(--muted);font-weight:700;
    padding:12px 14px;background:rgba(96,165,250,.06);
    border:1px solid rgba(96,165,250,.18);border-radius:12px;
    line-height:1.6;text-align:left;margin-bottom:14px;
  }

  /* ============ MODAL / OVERLAY ============ */
  .overlay{
    position:fixed;inset:0;z-index:1000;display:none;
    background:rgba(3,3,8,.9);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    overflow-y:auto;padding:22px 14px 44px;
    animation:screenIn .2s ease;
  }
  .overlay.show{display:block}
  .modal{
    max-width:520px;margin:0 auto;
    background:linear-gradient(180deg,#0e0e17,#08080f);
    border:1px solid var(--border-2);border-radius:22px;padding:22px;
    box-shadow:var(--shadow-lg);
  }
  .modal-title{font-size:19px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px}
  .modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px;font-weight:600;line-height:1.6}

  /* ============ PLAYER PICKER ============ */
  .picker-list{
    display:flex;flex-direction:column;gap:6px;
    max-height:52vh;overflow-y:auto;
    margin:-4px -6px 14px -4px;padding:4px 6px 4px 4px;
  }
  .picker-list::-webkit-scrollbar{width:5px}
  .picker-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  .picker-row{
    display:flex;align-items:center;gap:11px;
    padding:11px 13px;border-radius:13px;
    background:rgba(255,255,255,.025);border:1px solid var(--border);
    transition:.15s;cursor:pointer;text-align:left;
  }
  .picker-row:hover{background:rgba(255,255,255,.06);border-color:var(--border-2)}
  .picker-row.sel{
    background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(251,191,36,.05));
    border-color:rgba(251,191,36,.5);
  }
  .picker-row.disabled{opacity:.42;cursor:not-allowed}
  .picker-row.disabled:hover{background:rgba(255,255,255,.025);border-color:var(--border)}
  .picker-check{
    width:22px;height:22px;border-radius:7px;flex-shrink:0;
    background:rgba(255,255,255,.06);border:1.5px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;
    transition:.15s;
  }
  .picker-row.sel .picker-check{
    background:var(--gold);border-color:var(--gold);color:#1a1206;
  }
  .picker-empty{
    text-align:center;padding:32px 16px;color:var(--muted);
    font-size:12.5px;font-weight:700;line-height:1.65;
  }

  /* ============ PACK EDITOR ============ */
  .field{margin-bottom:16px}
  .field-label{
    font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;

  .item-name-in{
    width:100%;padding:11px 13px;border-radius:11px;font-size:13.5px;font-weight:700;

  .item-val-in{
    width:100%;padding:11px 8px 11px 20px;border-radius:11px;

  .item-del{
    width:34px;height:38px;border-radius:10px;
    background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);
    color:var(--red);font-size:16px;font-weight:900;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .item-del:hover{background:rgba(248,113,113,.18)}
  .item-del:active{transform:scale(.93)}
  .items-toolbar{display:flex;gap:7px;margin-top:10px}
  .items-toolbar button{
    flex:1;padding:11px;border-radius:11px;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
    letter-spacing:.3px;transition:.15s;
  }
  .items-toolbar button:hover{background:rgba(255,255,255,.1)}
  .items-meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;color:var(--muted-2);font-weight:800;margin-top:9px;
    letter-spacing:.4px;
  }
  .items-meta b{color:var(--gold);font-weight:900}

  .bulk-area{display:none;margin-top:10px}
  .bulk-area.show{display:block}
  .bulk-area textarea{
    width:100%;min-height:130px;resize:vertical;
    background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;
    padding:12px;color:var(--text);font-size:12.5px;outline:none;
    line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;
  }

    background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;

  }

  .modal-actions{display:flex;gap:8px;margin-top:8px}
  .modal-actions .btn-primary{flex:1.4}
  .modal-actions .btn-ghost{flex:1}

  /* ============ GAME ============ */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-bottom:10px;
  }
  .topic-pill{
    display:inline-flex;align-items:center;gap:7px;

  }

    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .counter{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.3px;flex-shrink:0}

  }
  .progress>div{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,#fbbf24,#f59e0b);
    transition:width .5s cubic-bezier(.3,.9,.4,1);
    box-shadow:0 0 12px rgba(251,191,36,.5);
  }

  .item-card{
    position:relative;border-radius:26px;padding:36px 24px;text-align:center;overflow:hidden;
    background:
      linear-gradient(160deg,rgba(251,191,36,.14) 0%,rgba(168,85,247,.12) 55%,rgba(96,165,250,.08) 100%);
    border:1px solid rgba(251,191,36,.28);
    box-shadow:
      0 16px 50px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.08);
    margin-bottom:12px;
  }
  .item-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);
    background-size:500px 100%;
    animation:shimmer 4s linear infinite;
    pointer-events:none;
  }
  .item-label{
    font-size:9.5px;letter-spacing:3.5px;color:var(--muted);font-weight:900;
    margin-bottom:14px;position:relative;
  }
  .item-name{
    font-size:clamp(22px,6.6vw,33px);font-weight:900;line-height:1.12;
    word-break:break-word;position:relative;letter-spacing:-.7px;
  }
  .item-value{
    margin-top:18px;font-size:11.5px;color:var(--muted);font-weight:800;
    letter-spacing:.4px;position:relative;display:inline-flex;align-items:center;gap:7px;
    padding:6px 13px;border-radius:99px;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);
  }
  .item-value span{color:var(--gold);font-weight:900;letter-spacing:2.5px}

  .bid-banner{
    text-align:center;padding:13px 14px;border-radius:14px;margin-bottom:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);
    font-size:13.5px;font-weight:700;transition:.25s;letter-spacing:-.1px;
  }
  .bid-banner strong{color:var(--gold);font-weight:900}
  .bid-banner.empty{color:var(--muted);font-size:12.5px;font-weight:600}

  .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:12px}
  .pcard{
    position:relative;padding:14px 8px 12px;border-radius:16px;text-align:center;
    background:var(--surface);border:1px solid var(--border);
    transition:.25s;overflow:hidden;
  }
  .pcard.active{
    border-color:rgba(251,191,36,.65);
    background:linear-gradient(180deg,rgba(251,191,36,.12),rgba(251,191,36,.04));
    animation:pulseGold 2.4s ease-in-out infinite;
  }
  .pcard.folded,.pcard.broke{opacity:.36;filter:grayscale(.5)}
  .p-avatar{
    width:32px;height:32px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12.5px;color:#fff;letter-spacing:-.3px;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.22);
  }
  .pname{
    font-size:11.5px;font-weight:800;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05px;
  }
  .pid{
    font-size:8.5px;font-weight:900;color:var(--gold);letter-spacing:.8px;
    margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.72;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pmoney{font-size:16px;font-weight:900;color:var(--green);margin-top:4px;letter-spacing:-.3px}
  .pitems{font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:800;letter-spacing:.3px}
  .pbadge{
    position:absolute;top:0;left:0;right:0;font-size:7.5px;font-weight:900;
    letter-spacing:1.2px;padding:3px 0;text-align:center;text-transform:uppercase;
  }
  .pbadge.high{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1206}
  .pbadge.out,.pbadge.broke{background:rgba(255,255,255,.13);color:var(--muted)}
  .pcard:has(.pbadge) .p-avatar{margin-top:8px}

  .controls{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;
  }
  .turn-line{
    text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:14px;
    font-weight:700;letter-spacing:.2px;
  }
  .turn-line strong{color:var(--gold);font-weight:900;font-size:14px}
  .bid-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
  .bid-amount{
    font-size:38px;font-weight:900;color:var(--gold);
    min-width:120px;text-align:center;letter-spacing:-1.6px;line-height:1;
    text-shadow:0 0 30px rgba(251,191,36,.35);
  }
  .bid-step{
    width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:.12s;
  }
  .bid-step:hover{background:rgba(255,255,255,.1)}
  .bid-step:active{transform:scale(.94)}
  .quick{display:flex;gap:7px;margin-bottom:12px}
  .quick button{
    flex:1;padding:10px 4px;border-radius:11px;font-size:11.5px;font-weight:900;
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);
    letter-spacing:.3px;transition:.13s;
  }
  .quick button:hover{background:rgba(255,255,255,.09);color:var(--text-2)}
  .quick button:active{background:rgba(255,255,255,.14);color:var(--text)}
  .btn-bid{
    width:100%;padding:16px;border-radius:15px;font-size:15px;font-weight:900;letter-spacing:.7px;
    background:linear-gradient(135deg,#34d399,#10b981);color:#04231a;
    box-shadow:0 8px 24px rgba(52,211,153,.26), inset 0 1px 0 rgba(255,255,255,.3);
    margin-bottom:9px;transition:transform .1s;
  }
  .btn-bid:active{transform:scale(.985)}
  .btn-fold{
    width:100%;padding:13px;border-radius:15px;font-size:12.5px;font-weight:900;
    letter-spacing:.8px;background:transparent;
    border:1px solid rgba(248,113,113,.32);color:var(--red);
    transition:.15s;text-transform:uppercase;
  }
  .btn-fold:hover{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.5)}
  .cant{
    text-align:center;font-size:12.5px;color:var(--red);font-weight:800;
    padding:16px 0;margin-bottom:9px;letter-spacing:.2px;
  }

  /* ============ FLASH ============ */
  .flash{
    position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
    background:rgba(3,3,8,.86);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;transition:opacity .28s;padding:20px;
  }
  .flash.show{opacity:1}
  .flash-inner{text-align:center;animation:pop .4s cubic-bezier(.2,1.5,.5,1)}
  .flash-sold{
    font-size:52px;font-weight:900;letter-spacing:4.5px;line-height:1;
    background:linear-gradient(100deg,#fde68a 0%,#fbbf24 45%,#f59e0b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(251,191,36,.5));
  }
  .flash-sold.unsold{
    background:linear-gradient(100deg,#8b8b9a,#c4c4d0);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 4px 22px rgba(180,180,200,.25));
  }
  .flash-item{font-size:21px;font-weight:900;margin-top:10px;letter-spacing:-.3px}
  .flash-price{font-size:13.5px;color:var(--muted);margin-top:9px;font-weight:700}
  .flash-profit{font-size:12.5px;font-weight:900;margin-top:6px;letter-spacing:.4px}
  .flash-profit.pos{color:var(--green)}
  .flash-profit.neg{color:var(--red)}

  /* ============ RESULTS ============ */
  .winner-box{
    text-align:center;padding:34px 20px;border-radius:24px;margin-bottom:14px;

      radial-gradient(ellipse at 50% 0%, rgba(251,191,36,.28), transparent 65%),
      linear-gradient(160deg,rgba(251,191,36,.08),rgba(168,85,247,.06));
    border:1px solid rgba(251,191,36,.32);
    box-shadow:0 16px 46px rgba(251,191,36,.13);
    position:relative;overflow:hidden;
  }
  .winner-box::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);

  }

    font-size:32px;font-weight:900;margin-top:6px;color:var(--gold);
    word-break:break-word;letter-spacing:-.8px;position:relative;

  .elo-change{
    display:inline-flex;align-items:center;gap:9px;margin-top:16px;

    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.09);
    font-size:12px;font-weight:800;letter-spacing:.2px;position:relative;
  }
  .elo-change .elo-delta{font-weight:900;font-size:13px}
  .elo-change .elo-delta.up{color:var(--green)}
  .elo-change .elo-delta.down{color:var(--red)}

  .rank-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
  .rank-row{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:15px;transition:.2s;
  }
  .rank-row.first{
    border-color:rgba(251,191,36,.4);

  .rank-head{display:flex;align-items:center;gap:10px}
  .medal{font-size:18px;width:24px;text-align:center;flex-shrink:0}

    display:flex;align-items:center;gap:7px;
  }
  .rname .rid{
    font-size:9.5px;font-weight:900;color:var(--gold);letter-spacing:.8px;
    font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.85;
  }

  .chip .paid{color:var(--muted);font-weight:700;font-size:9.5px}
  .chip .paid.profit{color:var(--green)}
  .chip .paid.loss{color:var(--red)}

  /* ============ LEADERBOARD ============ */
  .lb-header{text-align:center;padding:14px 0 20px}
  .lb-header h2{
    margin:0;font-size:27px;font-weight:900;letter-spacing:-.6px;
    background:linear-gradient(100deg,#fde68a 0%,#fbbf24 45%,#f59e0b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .lb-header p{color:var(--muted);font-size:12px;margin:9px 0 0;font-weight:700}
  .lb-tabs{
    display:flex;gap:4px;padding:4px;margin-bottom:14px;
    background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:14px;
  }
  .lb-tab{
    flex:1;padding:10px;border-radius:10px;font-size:12.5px;font-weight:800;
    background:transparent;color:var(--muted);transition:.15s;letter-spacing:.2px;

    background:linear-gradient(135deg,rgba(251,191,36,.18),rgba(251,191,36,.08));

  .lb-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}

  }

  .lb-rank{
    width:26px;text-align:center;font-weight:900;font-size:13px;
    color:var(--muted-2);flex-shrink:0;letter-spacing:-.3px;
  }
  .lb-rank.top1{color:var(--gold);font-size:17px}
  .lb-rank.top2{color:#c9ccd6;font-size:16px}
  .lb-rank.top3{color:#d1996a;font-size:16px}
  .lb-avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13.5px;color:#fff;overflow:hidden;
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.22);
    letter-spacing:-.2px;
  }
  .lb-avatar img{width:100%;height:100%;object-fit:cover}
  .lb-info{flex:1;min-width:0}
  .lb-name{
    font-size:13.5px;font-weight:800;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;letter-spacing:-.05px;
    display:flex;align-items:center;gap:7px;
  }
  .lb-pid{
    font-size:9.5px;color:var(--gold);font-weight:900;letter-spacing:.7px;
    font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.8;
    background:rgba(251,191,36,.1);padding:2px 6px;border-radius:5px;
  }
  .lb-you{
    font-size:8.5px;font-weight:900;letter-spacing:1.2px;
    padding:2px 6px;border-radius:99px;
    background:rgba(251,191,36,.15);color:var(--gold);
  }
  .lb-stats{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px;letter-spacing:.15px}
  .lb-elo{
    font-size:17px;font-weight:900;color:var(--gold);letter-spacing:-.4px;
    text-align:right;flex-shrink:0;line-height:1;
  }
  .lb-elo small{display:block;font-size:9px;color:var(--muted-2);font-weight:800;letter-spacing:.7px;margin-top:3px}

  .empty-state{
    text-align:center;padding:48px 20px;color:var(--muted);
    font-size:13px;font-weight:700;line-height:1.65;
  }
  .empty-state .big{font-size:44px;display:block;margin-bottom:16px;opacity:.55}

  /* ============ TOAST ============ */
  .toast-wrap{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;
    pointer-events:none;padding:0 16px;
  }
  .toast{
    padding:12px 19px;border-radius:99px;font-size:12.5px;font-weight:800;
    background:rgba(20,20,28,.97);border:1px solid var(--border-2);
    color:var(--text);box-shadow:var(--shadow-md);
    animation:toastIn .3s cubic-bezier(.2,1.3,.5,1);
    max-width:92vw;text-align:center;letter-spacing:.1px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .toast.success{border-color:rgba(52,211,153,.4)}
  .toast.error{border-color:rgba(248,113,113,.4)}

  .spin{
    width:14px;height:14px;border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--gold);border-radius:50%;
    animation:spin .8s linear infinite;
  }
</style>

<body>

<div class="app">
  <header class="app-header">
    <div class="brand">

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(name){

function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function initialsOf(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function colorFor(seed){
  let h = 0;
  for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

}

const registry = {
  local: {}, loaded: false,
  load(){
    if (this.loaded) return;
    try { this.local = JSON.parse(localStorage.getItem(PLAYERS_KEY) || '{}'); } catch(e){ this.local = {}; }
    this.loaded = true;
  },
  save(){ try { localStorage.setItem(PLAYERS_KEY, JSON.stringify(this.local)); } catch(e){} },
  normalizeId(s){ return String(s || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); },
  isValidId(id){ return /^[A-Z]{2,4}\d{1,6}$/.test(String(id || '')); },
  randomId(name){
    const letters = String(name || 'PL').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2) || 'PL';
    return letters + String(Math.floor(Math.random() * 9000) + 1000);
  },
  getLocal(id){ this.load(); return this.local[id] || null; },
  async get(id){
    if (!id) return null;
    if (cloud.enabled && cloud.db){
      try {
        const ref = cloud.fb.dbMod.doc(cloud.db, 'players', id);
        const snap = await cloud.fb.dbMod.getDoc(ref);
        if (snap.exists()) return snap.data();
      } catch(e){}
    }
    return this.getLocal(id);
  },
  async upsert(id, data){
    if (!id || !this.isValidId(id)) return;
    this.load();
    const existing = this.local[id] || { createdAt: Date.now() };
    const merged = { ...existing, ...data, id, updatedAt: Date.now() };
    this.local[id] = merged;
    this.save();
    if (cloud.enabled && cloud.user && cloud.db){
      try {
        const ref = cloud.fb.dbMod.doc(cloud.db, 'players', id);
        await cloud.fb.dbMod.setDoc(ref, merged, { merge: true });
      } catch(e){ console.warn('player save failed', e); }
    }
  },
  async listAll(){
    this.load();
    const map = { ...this.local };
    if (cloud.enabled && cloud.db){
      try {
        const col = cloud.fb.dbMod.collection(cloud.db, 'players');
        const q = cloud.fb.dbMod.query(col, cloud.fb.dbMod.orderBy('elo','desc'), cloud.fb.dbMod.limit(200));
        const snap = await cloud.fb.dbMod.getDocs(q);
        snap.forEach(d => {
          const data = d.data();
          map[d.id] = { ...(map[d.id] || {}), ...data, id: d.id };
        });
      } catch(e){ console.warn('players list failed', e); }
    }
    return Object.values(map).sort((a, b) => (b.elo || 0) - (a.elo || 0));
  }
};

    return arr.filter(p => p && p.id && Array.isArray(p.items)).map(p => ({
      id: p.id,
      name: String(p.name || 'Untitled'),
      emoji: p.emoji || '✨',
      ownerUid: p.ownerUid || null,
      ownerPlayerId: p.ownerPlayerId || null,

  } catch(e){ return []; }
}

async function initCloud(){
  registry.load();
  if (!FIREBASE_ENABLED){ cloud.ready = true; renderHeader(); return; }
  try {
    const [appMod, authMod, dbMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    cloud.auth = authMod.getAuth(app);
    cloud.db   = dbMod.getFirestore(app);
    cloud.fb   = { authMod, dbMod };

    authMod.onAuthStateChanged(cloud.auth, async user => {
      cloud.user = user;
      cloud.ready = true;
      if (user){
        await loadUserProfile();
        await pullCloudPacks();
        presence.start();
        await checkCurrentLobby();
      } else {
        cloud.profile = loadLocalProfile();
        presence.stop();
      }
      renderHeader();
      refreshSetupScreen();
    });
  } catch(e){
    console.warn('[AuctionWars] Firebase init failed:', e);
    cloud.ready = true;
    renderHeader();
    toast('Cloud init failed', 'error');
  }
}

async function signIn(){
  if (!cloud.enabled){ toast('Cloud not configured', 'error'); return; }
  try {
    const provider = new cloud.fb.authMod.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    await cloud.fb.authMod.signInWithPopup(cloud.auth, provider);
    toast('Signed in', 'success');
  } catch(e){
    let msg = 'Sign-in failed';
    if (e?.code === 'auth/unauthorized-domain') msg = 'Domain not authorized in Firebase';
    if (e?.code === 'auth/popup-blocked') msg = 'Popup blocked';
    if (e?.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled';
    toast(msg, 'error');
  }
}

        currentLobby: session.lobbyId || null,

      }, { merge: true });
    } catch(e){ console.warn('presence push failed', e); }
  },

  async setOffline(){
    if (!cloud.user || !cloud.profile?.playerId || !cloud.db) return;
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'presence', cloud.profile.playerId);
      await cloud.fb.dbMod.updateDoc(ref, { online: false, lastSeen: Date.now(), currentLobby: null });
    } catch(e){}
  },

  async setLobby(lobbyId){
    if (!cloud.user || !cloud.profile?.playerId || !cloud.db) return;
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'presence', cloud.profile.playerId);
      await cloud.fb.dbMod.updateDoc(ref, { currentLobby: lobbyId || null, lastSeen: Date.now() });
    } catch(e){}
  },

  start(){
    this.stop();
    this.push();
    this.interval = setInterval(() => this.push(), 20000);
    window.addEventListener('beforeunload', () => { this.setOffline(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) this.push();
    });
  },

  stop(){
    if (this.interval){ clearInterval(this.interval); this.interval = null; }
  },

  async fetchOnline(){
    if (!cloud.enabled || !cloud.db || !cloud.user) return [];
    try {
      const col = cloud.fb.dbMod.collection(cloud.db, 'presence');
      const q = cloud.fb.dbMod.query(col, cloud.fb.dbMod.where('online', '==', true));
      const snap = await cloud.fb.dbMod.getDocs(q);
      const now = Date.now();
      const list = [];
      snap.forEach(d => {
        const data = d.data();
        if (!data.lastSeen || now - data.lastSeen > ONLINE_TIMEOUT_MS) return;
        list.push({ ...data, id: d.id });
      });
      return list;
    } catch(e){
      console.warn('fetchOnline failed', e);
      return [];
    }
  }
};

      for (const p of players){
        try {
          const pref = cloud.fb.dbMod.doc(cloud.db, 'presence', p.id);
          await cloud.fb.dbMod.setDoc(pref, {
            currentLobby: lobbyId,
            lastSeen: Date.now(),
            online: true
          }, { merge: true });
        } catch(e){}
      }
      return lobbyId;
    } catch(e){
      console.warn('lobby create failed', e);
      return null;
    }
  },

  async leave(lobbyId, playerId){
    if (!cloud.enabled || !cloud.db) return;
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'lobbies', lobbyId);
      const snap = await cloud.fb.dbMod.getDoc(ref);
      if (!snap.exists()){
        await this._clearPresence(playerId);
        return;
      }
      const data = snap.data();
      const remaining = (data.players || []).filter(p => p.id !== playerId);
      if (remaining.length < 2 || playerId === data.hostId){
        // dissolve if host leaves or fewer than 2 players remain
        await cloud.fb.dbMod.deleteDoc(ref);
        for (const p of (data.players || [])){
          await this._clearPresence(p.id);
        }
      } else {
        await cloud.fb.dbMod.updateDoc(ref, { players: remaining });
        await this._clearPresence(playerId);
      }
    } catch(e){ console.warn('leave failed', e); }
  },

  async dissolve(lobbyId){
    if (!cloud.enabled || !cloud.db || !lobbyId) return;
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'lobbies', lobbyId);
      const snap = await cloud.fb.dbMod.getDoc(ref);
      if (!snap.exists()) return;
      const data = snap.data();
      for (const p of (data.players || [])){
        await this._clearPresence(p.id);
      }
      await cloud.fb.dbMod.deleteDoc(ref);
    } catch(e){}
  },

  async _clearPresence(playerId){
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'presence', playerId);
      await cloud.fb.dbMod.updateDoc(ref, { currentLobby: null });
    } catch(e){}
  },

  async get(lobbyId){
    if (!cloud.enabled || !cloud.db || !lobbyId) return null;
    try {
      const ref = cloud.fb.dbMod.doc(cloud.db, 'lobbies', lobbyId);
      const snap = await cloud.fb.dbMod.getDoc(ref);
      return snap.exists() ? snap.data() : null;
    } catch(e){ return null; }
  },

  watch(lobbyId, cb){
    if (!cloud.enabled || !cloud.db) return () => {};
    const ref = cloud.fb.dbMod.doc(cloud.db, 'lobbies', lobbyId);
    return cloud.fb.dbMod.onSnapshot(ref, snap => {
      cb(snap.exists() ? snap.data() : null);
    }, err => console.warn('lobby watch error', err));
  }
};

function getSelectedPack(){
  if (setup.packId.startsWith('custom_')){
    return setup.myPacks.find(p => p.id === setup.packId)
        || setup.allPublicPacks.find(p => p.id === setup.packId)
        || null;
  }
  if (PACKS[setup.packId]){
    return {
      name: setup.packId, emoji: '', ownerUid: null,
      items: PACKS[setup.packId].map(([name, value]) => ({ name, value }))
    };
  }
  return null;
}
function getSelectedItems(){
  const p = getSelectedPack();
  return p ? p.items.slice() : [];
}
function getSelectedLabel(){
  const p = getSelectedPack();
  if (!p) return '—';
  return setup.packId.startsWith('custom_') ? `${p.emoji} ${p.name}` : p.name;
}
function isOwner(pack){
  if (!pack || !pack.ownerUid) return !pack || !pack.id?.startsWith('custom_');
  return pack.ownerUid === cloud.user?.uid;
}

/* ---- Setup event handlers ---- */
$('screen-setup').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.pack !== undefined && btn.dataset.pack !== ''){
    setup.packId = btn.dataset.pack;
    renderSetup();
  } else if (btn.dataset.newpack){
    openEditor(null);
  } else if (btn.dataset.editpack){
    const pack = setup.myPacks.find(p => p.id === btn.dataset.editpack);
    if (!pack || !isOwner(pack)){ toast('You can only edit your own packs', 'error'); return; }
    openEditor(btn.dataset.editpack);
  } else if (btn.dataset.deletepack){
    const id = btn.dataset.deletepack;
    const pack = setup.myPacks.find(p => p.id === id);
    if (!pack || !isOwner(pack)){ toast('You can only delete your own packs', 'error'); return; }
    if (!confirm('Delete this pack? This cannot be undone.')) return;
    setup.myPacks = setup.myPacks.filter(p => p.id !== id);
    saveLocalPacks(setup.myPacks);
    deletePackFromCloud(id);
    if (setup.packId === id) setup.packId = Object.keys(PACKS)[0];
    renderSetup();
    toast('Pack deleted');
  } else if (btn.dataset.removeComp){
    session.pickedIds = session.pickedIds.filter(id => id !== btn.dataset.removeComp);
    renderSetup();
  } else if (btn.id === 'addCompBtn'){
    openPlayerPicker();
  } else if (btn.dataset.count){
    setup.playerCount = +btn.dataset.count;
    renderSetup();
  } else if (btn.dataset.cash){
    setup.cash = clamp(setup.cash + (+btn.dataset.cash), 10, 500);
    renderSetup();
  } else if (btn.dataset.items){
    setup.itemCount = +btn.dataset.items;
    renderSetup();
  } else if (btn.id === 'startBtn'){
    startGame();
  }
});

$('screen-setup').addEventListener('input', e => {

  if (t.dataset.localName !== undefined){

});

            <span>${disabled ? 'In another match' : 'Online'}</span>
          </div>
        </div>
        <div class="picker-check">✓</div>
      </button>
    `;
  }).join('');

  openModal(`
    <div class="modal">
      <div class="modal-title">Add competitors</div>
      <div class="modal-sub">Only online players who aren't already in a match can be added.</div>
      ${others.length ? `
        <div class="picker-list" id="pickerList">
          ${rows}
        </div>
      ` : `
        <div class="picker-empty">
          <span style="font-size:36px;display:block;margin-bottom:12px;opacity:.5">👥</span>
          No other players are online right now.<br>
          Ask a friend to sign in and keep their tab open.
        </div>
      `}
      <div class="modal-actions">
        <button class="btn-ghost" id="pickerCancel">Cancel</button>
        <button class="btn-primary" id="pickerDone" ${others.length === 0 ? 'disabled' : ''}>Done</button>
      </div>
    </div>
  `);

  $('pickerCancel').addEventListener('click', closeModal);
  $('pickerDone').addEventListener('click', closeModal);

  $('pickerList')?.addEventListener('click', e => {
    const row = e.target.closest('[data-pick-id]');
    if (!row || row.disabled) return;
    const id = row.dataset.pickId;
    if (session.pickedIds.includes(id)){
      session.pickedIds = session.pickedIds.filter(x => x !== id);
      row.classList.remove('sel');
    } else {
      if (session.pickedIds.length >= 3){ toast('Max 3 competitors', 'error'); return; }
      session.pickedIds.push(id);
      row.classList.add('sel');
    }
  });
}

function parseBulk(text){
  const out = [];
  String(text).split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    let name = line, val = 5, m;
    if ((m = line.match(/^(.+?)\s*\|\s*(-?\d+)\s*$/))){ name = m[1].trim(); val = parseInt(m[2], 10); }
    else if ((m = line.match(/^(.+?)\s*[,:]\s*(-?\d+)\s*$/))){ name = m[1].trim(); val = parseInt(m[2], 10); }
    name = name.replace(/^[-•*]\s*/, '').trim();
    if (!name) return;
    out.push({ name, value: clamp(isNaN(val) ? 5 : val, 1, 99) });
  });
  return out;
}

async function checkCurrentLobby(){
  if (!cloud.user || !cloud.profile?.playerId) return;
  try {
    const ref = cloud.fb.dbMod.doc(cloud.db, 'presence', cloud.profile.playerId);
    const snap = await cloud.fb.dbMod.getDoc(ref);
    if (!snap.exists()) return;
    const data = snap.data();
    if (data.currentLobby){
      const lb = await lobby.get(data.currentLobby);
      if (!lb){
        await presence.setLobby(null);
        return;
      }
      if (lb.hostUid === cloud.user.uid){
        // We're the host; we lost our game state, dissolve the lobby.
        await lobby.dissolve(data.currentLobby);
        await presence.setLobby(null);
        return;
      }
      // We're a participant in someone else's lobby
      session.lobbyId = data.currentLobby;
      renderLobby(lb);
      showScreen('lobby');
    }
  } catch(e){ console.warn('checkCurrentLobby failed', e); }
}

/* ============================================================================
   GAME STATE
   ========================================================================== */
const state = {
  topicName: '',
  players: [],
  items: [],
  idx: 0,
  currentBid: 0,
  highBidder: null,
  turn: 0,
  pendingBid: 1,
  locked: false
};

async function startGame(){
  const pool = getSelectedItems();
  if (pool.length < 2){ toast('This pack needs at least 2 items', 'error'); return; }

  // Collect participants
  let participants = [];

  if (cloud.user && cloud.profile){
    // Signed-in mode: self + picked competitors
    const me = {
      id: cloud.profile.playerId,
      name: cloud.profile.displayName || 'You',
      photoURL: cloud.profile.photoURL || ''
    };
    participants.push(me);

    const onlineMap = new Map(session.onlinePlayers.map(p => [p.id, p]));
    for (const id of session.pickedIds){
      const p = onlineMap.get(id);
      if (p){
        participants.push({ id: p.id, name: p.name, photoURL: p.photoURL || '' });
      }
    }

    if (participants.length < 2){
      toast('Add at least 1 competitor to start', 'error');
      return;
    }
  } else {
    // Offline mode: use local names
    for (let i = 0; i < setup.playerCount; i++){
      participants.push({
        id: null,
        name: (setup.localNames?.[i] || '').trim() || ('Player ' + (i + 1)),
        photoURL: ''
      });
    }
  }

  // Create lobby for online mode
  if (cloud.user && cloud.enabled && cloud.db){
    const lobbyId = await lobby.create(
      { id: cloud.profile.playerId, name: cloud.profile.displayName, photoURL: cloud.profile.photoURL },
      participants
    );
    if (lobbyId){
      session.lobbyId = lobbyId;
      session.hostingLobbyId = lobbyId;
      await presence.setLobby(lobbyId);
      startLobbyWatch(lobbyId);
    }
  }

  // Start the auction
  const count = Math.min(setup.itemCount, pool.length);
  const chosen = shuffle(pool).slice(0, count);
  state.items = chosen.map(it => ({ name: it.name, value: it.value, winner: null, price: null }));
  state.topicName = getSelectedLabel();
  state.players = participants.map((p, i) => ({
    id: i,
    playerId: p.id,
    name: p.name,
    photoURL: p.photoURL,
    money: setup.cash,
    items: [],
    inRound: true
  }));
  state.idx = 0;
  state.locked = false;

  showScreen('game');
  startItem();
}

/* ============================================================================
   ITEM FLOW
   ========================================================================== */
function startItem(){
  state.currentBid = 0;
  state.highBidder = null;
  state.locked = false;
  state.players.forEach(p => { p.inRound = p.money > 0; });

  const n = state.players.length;
  const start = state.idx % n;
  let found = -1;
  for (let k = 0; k < n; k++){
    const j = (start + k) % n;
    if (state.players[j].inRound){ found = j; break; }
  }
  state.turn = found;
  if (found === -1){ resolveItem(); return; }

  state.pendingBid = Math.min(state.currentBid + 1, state.players[found].money);
  renderGame();
}
function advanceTurn(){
  const n = state.players.length;
  for (let k = 1; k <= n; k++){
    const j = (state.turn + k) % n;
    if (state.players[j].inRound){ state.turn = j; return; }
  }
}
function afterAction(){
  const remaining = state.players.filter(p => p.inRound);
  if (remaining.length <= 1){ resolveItem(); return; }
  advanceTurn();
  const cur = state.players[state.turn];
  state.pendingBid = Math.min(state.currentBid + 1, cur.money);
  renderGame();
}
function resolveItem(){
  const item = state.items[state.idx];
  const remaining = state.players.filter(p => p.inRound);
  let winner = null, price = 0;
  if (remaining.length === 1 && state.highBidder !== null && remaining[0].id === state.highBidder){
    winner = remaining[0];
    price = state.currentBid;
  }
  if (winner){
    winner.money -= price;
    winner.items.push({ name: item.name, value: item.value, price });
    item.winner = winner.id;
    item.price = price;
  }
  state.locked = true;
  showFlash(item, winner, price);
  setTimeout(() => {
    state.idx++;
    const solvent = state.players.filter(p => p.money > 0).length;
    if (state.idx >= state.items.length || solvent <= 1) endGame();
    else startItem();
  }, 1550);
}

/* ============================================================================
   GAME RENDER
   ========================================================================== */
function renderGame(){
  const g = $('screen-game');
  const item = state.items[state.idx];
  const total = state.items.length;
  const cur = state.players[state.turn];
  const minB = state.currentBid + 1;
  const maxB = cur ? cur.money : 0;
  const canBid = cur && maxB >= minB;

  if (canBid) state.pendingBid = clamp(state.pendingBid, minB, maxB);

  g.innerHTML = `
    <div class="topbar">
      <div class="topic-pill"><span>${esc(state.topicName)}</span></div>
      <div class="counter">${state.idx + 1} / ${total}</div>
    </div>
    <div class="progress"><div style="width:${(state.idx / total) * 100}%"></div></div>

    <div class="item-card">
      <div class="item-label">ON THE BLOCK</div>
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-value">Hidden value <span>? ? ?</span></div>
    </div>

    <div class="bid-banner ${state.highBidder === null ? 'empty' : ''}">
      ${state.highBidder === null
        ? 'No bids yet — opening at $1'
        : `Current bid <strong>$${state.currentBid}</strong> by <strong>${esc(state.players[state.highBidder].name)}</strong>`}
    </div>

    <div class="players">
      ${state.players.map((p, i) => {
        const badge = (i === state.highBidder)
          ? '<div class="pbadge high">High bid</div>'
          : (p.money <= 0)
            ? '<div class="pbadge broke">Broke</div>'
            : (!p.inRound ? '<div class="pbadge out">Out</div>' : '');
        return `
          <div class="pcard ${i === state.turn ? 'active' : ''} ${(!p.inRound && p.money > 0) ? 'folded' : ''} ${p.money <= 0 ? 'broke' : ''}">
            ${badge}
            <div class="p-avatar" style="background:${colorFor(p.name)}">${esc(initialsOf(p.name))}</div>
            <div class="pname">${esc(p.name)}</div>
            ${p.playerId ? `<div class="pid">${esc(p.playerId)}</div>` : ''}
            <div class="pmoney">$${p.money}</div>
            <div class="pitems">${p.items.length} item${p.items.length === 1 ? '' : 's'}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="controls">
      <div class="turn-line">${cur ? `<strong>${esc(cur.name)}</strong>, your move` : ''}</div>
      ${canBid ? `
        <div class="bid-row">
          <button class="bid-step" data-action="dec">−</button>
          <div class="bid-amount">$${state.pendingBid}</div>
          <button class="bid-step" data-action="inc">+</button>
        </div>
        <div class="quick">
          <button data-action="quick" data-v="1">+$1</button>
          <button data-action="quick" data-v="5">+$5</button>
          <button data-action="quick" data-v="all">All in</button>
        </div>
        <button class="btn-bid" data-action="bid">BID $${state.pendingBid}</button>
      ` : `
        <div class="cant">Can't cover the minimum bid of $${minB}</div>
      `}
      <button class="btn-fold" data-action="fold">Fold</button>
    </div>
  `;
}

$('screen-game').addEventListener('click', e => {
  if (state.locked) return;
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const cur = state.players[state.turn];
  if (!cur) return;
  const minB = state.currentBid + 1;
  const maxB = cur.money;

  switch (btn.dataset.action){
    case 'inc': state.pendingBid = Math.min(state.pendingBid + 1, maxB); renderGame(); break;
    case 'dec': state.pendingBid = Math.max(state.pendingBid - 1, minB); renderGame(); break;
    case 'quick': {
      const v = btn.dataset.v;
      if (v === 'all') state.pendingBid = maxB;
      else state.pendingBid = clamp(state.pendingBid + (+v), minB, maxB);
      renderGame();
      break;
    }
    case 'bid': {
      const amt = state.pendingBid;
      if (amt <= state.currentBid || amt > cur.money) return;
      state.currentBid = amt;
      state.highBidder = cur.id;
      afterAction();
      break;
    }
    case 'fold': cur.inRound = false; afterAction(); break;
  }
});

function showFlash(item, winner, price){
  const el = document.createElement('div');
  el.className = 'flash';
  if (winner){
    const profit = item.value - price;
    const cls = profit >= 0 ? 'pos' : 'neg';
    const sign = profit >= 0 ? '+' : '−';
    el.innerHTML = `
      <div class="flash-inner">
        <div class="flash-sold">SOLD!</div>
        <div class="flash-item">${esc(item.name)}</div>
        <div class="flash-price">${esc(winner.name)} pays $${price}</div>
        <div class="flash-profit ${cls}">Value ${item.value} · ${sign}$${Math.abs(profit)}</div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="flash-inner">
        <div class="flash-sold unsold">NO SALE</div>
        <div class="flash-item">${esc(item.name)}</div>
        <div class="flash-price">Everyone folded · value was ${item.value}</div>
      </div>`;
  }
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 1350);
}

/* ============================================================================
   ELO
   ========================================================================== */
function computeElo(players, K){
  K = K || 32;
  const n = players.length;
  const deltas = players.map(() => 0);
  if (n < 2) return deltas;
  for (let i = 0; i < n; i++){
    for (let j = 0; j < n; j++){
      if (i === j) continue;
      const Ea = 1 / (1 + Math.pow(10, (players[j].rating - players[i].rating) / 400));
      let Sa = 0.5;
      if (players[i].placement < players[j].placement) Sa = 1;
      else if (players[i].placement > players[j].placement) Sa = 0;
      deltas[i] += (K / (n - 1)) * (Sa - Ea);
    }
  }
  return deltas.map(d => Math.round(d));
}

async function recordMatchResults(ranked){
  const identified = ranked
    .map((r, i) => ({ ...r, idx: i }))
    .filter(r => r.id && registry.isValidId(r.id));
  if (!identified.length) return null;

  const records = await Promise.all(identified.map(async r => {
    const data = await registry.get(r.id);
    return {
      id: r.id, name: r.name, placement: r.placement, idx: r.idx,
      elo: (data?.elo ?? 1000),
      prev: data || null
    };
  }));

  const participants = ranked.map(r => ({
    rating: r.id && registry.isValidId(r.id)
      ? (records.find(x => x.id === r.id)?.elo ?? 1000)
      : 1000,
    placement: r.placement
  }));
  const deltas = computeElo(participants, 32);

  for (const rec of records){
    const delta = deltas[rec.idx];
    const newElo = clamp(rec.elo + delta, 100, 4000);
    const prev = rec.prev || {};
    const won = rec.placement === 0;
    const row = ranked[rec.idx];
    await registry.upsert(rec.id, {
      name: rec.name,
      elo: newElo,
      wins: (prev.wins || 0) + (won ? 1 : 0),
      games: (prev.games || 0) + 1,
      totalValue: (prev.totalValue || 0) + (row?.total || 0),
      ownerUid: prev.ownerUid || null
    });
  }

  const myId = cloud.profile?.playerId;
  if (myId){
    const myRec = records.find(r => r.id === myId);
    if (myRec){
      const delta = deltas[myRec.idx];
      return {
        delta,
        oldElo: myRec.elo,
        newElo: clamp(myRec.elo + delta, 100, 4000),
        playerId: myId
      };
    }
  }
  return null;
}

/* ============================================================================
   END GAME
   ========================================================================== */
async function endGame(){
  state.locked = true;
  const myId = cloud.profile?.playerId;

  const ranked = state.players.map(p => ({
    name: p.name,
    id: p.playerId,
    photoURL: p.photoURL,
    money: p.money,
    items: p.items,
    total: p.items.reduce((s, it) => s + it.value, 0),
    spent: p.items.reduce((s, it) => s + it.price, 0),
    isYou: myId && p.playerId === myId
  })).sort((a, b) => (b.total - a.total) || (b.money - a.money));

  ranked.forEach((r, i) => r.placement = i);

  // Dissolve lobby
  if (session.hostingLobbyId){
    await lobby.dissolve(session.hostingLobbyId);
    session.lobbyId = null;
    session.hostingLobbyId = null;
    stopLobbyWatch();
  }

  let eloResult = null;
  try { eloResult = await recordMatchResults(ranked); } catch(e){ console.warn(e); }

  renderResults(ranked, eloResult);
  showScreen('results');
}

function renderResults(ranked, eloResult){
  const top = ranked[0];
  const tie = ranked.length > 1 && ranked[1].total === top.total && ranked[1].money === top.money;
  const medals = ['🥇','🥈','🥉','4️⃣'];
  const unsold = state.items.filter(it => it.winner === null);

  let eloBlock = '';
  if (eloResult){
    const up = eloResult.delta >= 0;
    eloBlock = `
      <div class="elo-change">
        <span>${esc(eloResult.playerId)} · ${eloResult.oldElo} → <b>${eloResult.newElo}</b></span>
        <span class="elo-delta ${up ? 'up' : 'down'}">${up ? '+' : ''}${eloResult.delta}</span>
      </div>`;
  }

  $('screen-results').innerHTML = `
    <div class="winner-box">
      <div class="crown">${tie ? '🤝' : '👑'}</div>
      <div class="wlabel">${tie ? 'DEAD HEAT' : 'WINNER'}</div>
      <div class="wname">${esc(top.name)}</div>
      <div class="wsub">${top.total} total value · $${top.money} left</div>
      ${eloBlock}
    </div>

    <div class="rank-list">
      ${ranked.map((r, i) => `
        <div class="rank-row ${i === 0 ? 'first' : ''}">
          <div class="rank-head">
            <span class="medal">${medals[i] || ''}</span>
            <span class="rname">${esc(r.name)}${r.id ? `<span class="rid">${esc(r.id)}</span>` : ''}${r.isYou ? '<span class="lb-you">You</span>' : ''}</span>
            <span class="rval">${r.total} pts</span>
          </div>
          <div class="rline">$${r.money} left · spent $${r.spent} · ${r.items.length} item${r.items.length === 1 ? '' : 's'}</div>
          <div class="ritems">
            ${r.items.length
              ? r.items.map(it => {
                  const profit = it.value - it.price;
                  const cls = profit >= 0 ? 'profit' : 'loss';
                  const sign = profit >= 0 ? '+' : '−';
                  return `<span class="chip">${esc(it.name)} <b>${it.value}</b>
                          <span class="paid ${cls}">${sign}$${Math.abs(profit)}</span></span>`;
                }).join('')
              : '<span class="muted" style="font-size:11px;font-weight:700">bought nothing 😬</span>'}
          </div>
        </div>
      `).join('')}
    </div>

    ${unsold.length ? `
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Went unsold</div></div>
        <div class="ritems" style="margin-left:0">
          ${unsold.map(it => `<span class="chip">${esc(it.name)} <b>${it.value}</b></span>`).join('')}
        </div>
      </div>
    ` : ''}

    <button class="btn-primary" id="againBtn">Play again</button>
    <button class="btn-secondary" id="lbFromResults" style="margin-top:8px">View leaderboard</button>
  `;

  $('againBtn').addEventListener('click', () => {
    renderSetup();
    showScreen('setup');
    renderHeader();
  });
  $('lbFromResults').addEventListener('click', () => {
    renderLeaderboard();
    showScreen('leaderboard');
    renderHeader();
  });
}

/* ============================================================================
   LEADERBOARD
   ========================================================================== */
let lbSort = 'elo';

async function renderLeaderboard(){
  const el = $('screen-leaderboard');
  el.innerHTML = `
    <div class="lb-header"><h2>Leaderboard</h2><p>Loading…</p></div>
    <div class="empty-state"><span class="big"><div class="spin" style="margin:0 auto;width:20px;height:20px;border-width:3px"></div></span></div>
    <button class="btn-secondary" id="lbBack">Back</button>
  `;
  $('lbBack').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });

  let list = await registry.listAll();
  list = list.filter(u => u && u.id);

  if (lbSort === 'wins') list.sort((a, b) => (b.wins || 0) - (a.wins || 0) || (b.elo || 0) - (a.elo || 0));
  else if (lbSort === 'games') list.sort((a, b) => (b.games || 0) - (a.games || 0) || (b.elo || 0) - (a.elo || 0));
  else list.sort((a, b) => (b.elo || 0) - (a.elo || 0));

  const myId = cloud.profile?.playerId;

  if (!list.length){
    el.innerHTML = `
      <div class="lb-header"><h2>Leaderboard</h2><p>No games recorded yet</p></div>
      <div class="empty-state">
        <span class="big">🏆</span>
        Play a match to claim the top spot.
      </div>
      <button class="btn-secondary" id="lbBack2">Back</button>
    `;
    $('lbBack2').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });
    return;
  }

  el.innerHTML = `
    <div class="lb-header">
      <h2>Leaderboard</h2>
      <p>${list.length} tracked player${list.length === 1 ? '' : 's'}</p>
    </div>
    <div class="lb-tabs">
      <button class="lb-tab ${lbSort === 'elo' ? 'sel' : ''}" data-sort="elo">Elo</button>
      <button class="lb-tab ${lbSort === 'wins' ? 'sel' : ''}" data-sort="wins">Wins</button>
      <button class="lb-tab ${lbSort === 'games' ? 'sel' : ''}" data-sort="games">Games</button>
    </div>
    <div class="lb-list">
      ${list.slice(0, 100).map((u, i) => {
        const rank = i + 1;
        const rankCls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const isMe = myId && u.id === myId;
        const name = u.name || 'Player';
        return `
          <div class="lb-row ${isMe ? 'me' : ''}">
            <div class="lb-rank ${rankCls}">${medal}</div>
            <div class="lb-avatar" style="background:${colorFor(name)}">${esc(initialsOf(name))}</div>
            <div class="lb-info">
              <div class="lb-name">
                ${esc(name)}
                <span class="lb-pid">${esc(u.id)}</span>
                ${isMe ? '<span class="lb-you">You</span>' : ''}
              </div>
              <div class="lb-stats">${u.wins || 0}W · ${u.games || 0}G · ${(u.totalValue || 0)} total value</div>
            </div>
            <div class="lb-elo">${u.elo || 1000}<small>ELO</small></div>
          </div>
        `;
      }).join('')}
    </div>
    <button class="btn-secondary" id="lbBack3">Back</button>
  `;

  el.querySelectorAll('.lb-tab').forEach(tab => {
    tab.addEventListener('click', () => { lbSort = tab.dataset.sort; renderLeaderboard(); });
  });
  $('lbBack3').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });
}

/* ============================================================================
   BOOT
   ========================================================================== */
(async () => {
  registry.load();
  renderSetup();
  renderHeader();
  initCloud();
})();
</script>
