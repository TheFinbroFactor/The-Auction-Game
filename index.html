<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Auction Wars</title>
<style>
  :root{
    --bg:#08080f;--surface:#0f0f1a;--border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.12);
    --gold:#fbbf24;--green:#34d399;--red:#f87171;--purple:#a78bfa;
    --text:#f4f4f7;--text-2:#b8b8c5;--muted:#8a8a99;--muted-2:#5f5f6e;
    --shadow-lg:0 20px 50px rgba(0,0,0,.55);--shadow-md:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);
    background-image:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(251,191,36,.07), transparent 60%),
      radial-gradient(circle at 0% 0%, rgba(99,102,241,.10) 0%, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(168,85,247,.08) 0%, transparent 45%);
    background-attachment:fixed;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;justify-content:center;padding:14px 12px 40px;min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:100%;max-width:540px;display:flex;flex-direction:column}
  .screen{display:none;animation:screenIn .28s cubic-bezier(.2,.7,.3,1)}
  .screen.active{display:block}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}50%{box-shadow:0 0 0 6px rgba(52,211,153,0)}}
  @keyframes pulseGold{
    0%,100%{box-shadow:0 0 0 1px rgba(251,191,36,.4), 0 0 24px rgba(251,191,36,.15)}
    50%{box-shadow:0 0 0 1px rgba(251,191,36,.7), 0 0 32px rgba(251,191,36,.3)}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea{font-family:inherit}
  ::selection{background:rgba(251,191,36,.28);color:#fff}
  input::placeholder,textarea::placeholder{color:var(--muted-2)}

  .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 18px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{
    width:40px;height:40px;border-radius:13px;flex-shrink:0;
    background:linear-gradient(145deg,#fde68a,#fbbf24 40%,#d97706);
    box-shadow:0 6px 20px rgba(251,191,36,.35), inset 0 1px 0 rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;color:#1a1206;letter-spacing:-.5px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.05;gap:3px}
  .brand-name{font-size:15.5px;font-weight:900}
  .brand-sub{font-size:9px;color:var(--muted-2);font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:8px}
  .sync-dot{
    width:10px;height:10px;border-radius:50%;background:var(--muted-2);
    flex-shrink:0;transition:.3s;
  }
  .sync-dot.live{background:var(--green);animation:pulseDot 2.4s ease-in-out infinite}
  .sync-dot.polling{background:var(--gold)}
  .sync-dot.error{background:var(--red)}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.07)}
  .icon-btn.active{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.45);color:var(--gold)}
  .user-chip{
    display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);max-width:170px;
  }
  .user-avatar{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,#a78bfa,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:#fff;overflow:hidden;
  }
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-name small{font-size:9px;color:var(--muted-2);font-weight:800;letter-spacing:.6px;margin-left:5px;font-family:ui-monospace,Menlo,monospace}
  .signin-btn{
    display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;
    background:linear-gradient(135deg,#ffffff,#e4e4ed);color:#111117;
    font-size:12px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .panel-title{
    font-size:11px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--text-2);
    display:flex;align-items:center;gap:8px;
  }
  .panel-title .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;
    background:rgba(251,191,36,.14);color:var(--gold);font-size:9.5px;font-weight:900;
  }
  .panel-hint{font-size:10.5px;color:var(--muted-2);font-weight:700}
  .btn-primary{
    width:100%;padding:16px;border-radius:16px;font-size:14.5px;font-weight:900;letter-spacing:1.2px;
    background:linear-gradient(135deg,#fcd34d,#fbbf24 40%,#f59e0b);color:#1a1206;
    box-shadow:0 10px 30px rgba(251,191,36,.22), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:active{transform:scale(.985)}
  .btn-primary:disabled{opacity:.32;box-shadow:none;pointer-events:none;filter:grayscale(.5)}
  .btn-secondary{
    width:100%;padding:14px;border-radius:14px;font-size:13.5px;font-weight:800;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);color:var(--text);
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  }
  .btn-secondary:hover{background:rgba(255,255,255,.09)}
  .btn-ghost{
    padding:13px 16px;border-radius:14px;font-size:13px;font-weight:800;
    background:transparent;border:1px solid var(--border);color:var(--text-2);transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .btn-danger{color:var(--red);border-color:rgba(248,113,113,.3)}
  .btn-danger:hover{background:rgba(248,113,113,.08)}
  .hero{text-align:center;padding:6px 0 22px}
  .hero h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-1.4px;line-height:1}
  .hero h1 span{
    background:linear-gradient(100deg,#fde68a 0%,#fbbf24 45%,#f59e0b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--muted);font-size:13px;margin:10px 0 0;font-weight:600}
  .banner{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;
    background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.2);
    font-size:11.5px;font-weight:700;color:#bfd4f5;margin-bottom:12px;line-height:1.55;
  }
  .banner.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.22);color:#f3d99b}
  .banner.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.22);color:#a7f3d0}
  .banner.danger{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.25);color:#fecaca}
  .banner .icon{font-size:15px;flex-shrink:0;line-height:1.4}
  .banner b{color:var(--gold);font-weight:900}
  .pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pack{
    position:relative;padding:13px 12px;border-radius:14px;font-size:12.5px;font-weight:800;
    background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);
    text-align:left;display:flex;flex-direction:column;gap:5px;line-height:1.3;transition:.15s;
  }
  .pack:hover{background:rgba(255,255,255,.06)}
  .pack.sel{
    background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(251,191,36,.06));
    border-color:rgba(251,191,36,.55);color:var(--gold);
  }
  .pack .pname{display:block}
  .pack .pcount{font-size:9.5px;font-weight:800;color:var(--muted-2);letter-spacing:.5px}
  .pack.sel .pcount{color:rgba(251,191,36,.75)}
  .pack.new{
    border-style:dashed;border-color:rgba(255,255,255,.14);
    align-items:center;justify-content:center;text-align:center;
    color:var(--muted);font-weight:900;min-height:62px;flex-direction:row;gap:7px;
  }
  .pack-actions{display:flex;gap:6px;margin-top:12px}
  .pack-actions .btn-ghost{flex:1;padding:10px;font-size:11.5px}
  .competitors{display:flex;flex-direction:column;gap:8px}
  .comp-row{
    display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);
  }
  .comp-row.you{background:linear-gradient(135deg,rgba(251,191,36,.09),rgba(251,191,36,.03));border-color:rgba(251,191,36,.3)}
  .comp-row.guest{background:rgba(167,139,250,.04);border-color:rgba(167,139,250,.2)}
  .comp-avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;color:#fff;overflow:hidden;
  }
  .comp-avatar img{width:100%;height:100%;object-fit:cover}
  .comp-info{flex:1;min-width:0}
  .comp-name{
    font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:7px;
  }
  .comp-meta{font-size:10px;color:var(--muted-2);font-weight:800;margin-top:3px;display:flex;align-items:center;gap:7px}
  .comp-meta .pid{font-family:ui-monospace,Menlo,monospace;letter-spacing:.8px;color:var(--gold);font-weight:900;opacity:.8}
  .comp-meta .guest-tag{
    color:#c4b5fd;background:rgba(167,139,250,.14);
    padding:1px 6px;border-radius:5px;font-weight:900;letter-spacing:.6px;font-size:9px;
  }
  .comp-remove{
    width:28px;height:28px;border-radius:9px;flex-shrink:0;
    background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);
    color:var(--red);font-size:15px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
  }
  .add-buttons{display:flex;gap:8px;margin-top:2px}
  .add-comp{
    flex:1;padding:14px;border-radius:14px;background:rgba(255,255,255,.02);
    border:1.5px dashed rgba(255,255,255,.16);color:var(--muted);
    font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .add-comp:hover{background:rgba(251,191,36,.04);border-color:rgba(251,191,36,.35);color:var(--gold)}
  .online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulseDot 2.4s ease-in-out infinite}
  .seg{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px;border:1px solid var(--border)}
  .seg.wrap{flex-wrap:wrap}
  .segbtn{
    flex:1;padding:11px 6px;border-radius:10px;font-weight:800;font-size:13px;
    background:transparent;color:var(--muted);min-width:44px;
  }
  .segbtn.sel{background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(251,191,36,.1));color:var(--gold)}
  .stepper{display:flex;align-items:center;justify-content:center;gap:18px}
  .step{
    width:46px;height:46px;border-radius:14px;font-size:20px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step:hover{background:rgba(255,255,255,.1)}
  .step-val{font-size:28px;font-weight:900;color:var(--gold);min-width:104px;text-align:center;letter-spacing:-1px;line-height:1}
  .sub-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;font-weight:600;line-height:1.5}
  .sub-hint b{color:var(--gold);font-weight:900}
  .waiting-wrap{text-align:center;padding:20px 0 12px}
  .waiting-icon{
    width:78px;height:78px;border-radius:50%;margin:0 auto 20px;
    background:radial-gradient(circle at 50% 30%, rgba(251,191,36,.28), rgba(251,191,36,.06));
    border:1px solid rgba(251,191,36,.35);
    display:flex;align-items:center;justify-content:center;font-size:34px;
    box-shadow:0 12px 40px rgba(251,191,36,.2);animation:pulseGold 3s ease-in-out infinite;
  }
  .waiting-title{font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
  .waiting-sub{color:var(--muted);font-size:12.5px;margin-top:8px;font-weight:600;line-height:1.6}
  .waiting-list{display:flex;flex-direction:column;gap:8px;margin:22px 0 16px;text-align:left}
  .waiting-row{
    display:flex;align-items:center;gap:11px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
  }
  .waiting-row.host{border-color:rgba(251,191,36,.28);background:linear-gradient(135deg,rgba(251,191,36,.07),rgba(251,191,36,.02))}
  .waiting-row .badge{
    font-size:8.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;flex-shrink:0;
  }
  .waiting-row .badge.host-badge{background:rgba(251,191,36,.15);color:var(--gold)}
  .waiting-row .badge.guest-badge{background:rgba(167,139,250,.15);color:#c4b5fd}
  .waiting-row .badge.status-accepted{background:rgba(52,211,153,.15);color:var(--green)}
  .waiting-row .badge.status-pending{background:rgba(251,191,36,.15);color:var(--gold)}
  .waiting-row .badge.status-declined{background:rgba(248,113,113,.15);color:var(--red)}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .topic-pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
    background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.24);
    font-size:11.5px;font-weight:900;color:var(--gold);max-width:60%;overflow:hidden;
  }
  .topic-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;
    background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.28);
    font-size:10px;font-weight:900;letter-spacing:1.2px;color:var(--green);text-transform:uppercase;
  }
  .live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulseDot 1.6s ease-in-out infinite}
  .counter{font-size:11.5px;color:var(--muted);font-weight:800}
  .progress{height:5px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden;margin-bottom:16px}
  .progress>div{
    height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f59e0b);
    transition:width .5s cubic-bezier(.3,.9,.4,1);box-shadow:0 0 12px rgba(251,191,36,.5);
  }
  .item-card{
    position:relative;border-radius:26px;padding:36px 24px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,rgba(251,191,36,.14) 0%,rgba(168,85,247,.12) 55%,rgba(96,165,250,.08) 100%);
    border:1px solid rgba(251,191,36,.28);
    box-shadow:0 16px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    margin-bottom:12px;
  }
  .item-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);
    background-size:500px 100%;animation:shimmer 4s linear infinite;pointer-events:none;
  }
  .item-label{font-size:9.5px;letter-spacing:3.5px;color:var(--muted);font-weight:900;margin-bottom:14px;position:relative}
  .item-name{font-size:clamp(22px,6.6vw,33px);font-weight:900;line-height:1.12;word-break:break-word;position:relative;letter-spacing:-.7px}
  .item-value{
    margin-top:18px;font-size:11.5px;color:var(--muted);font-weight:800;position:relative;
    display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);
  }
  .item-value span{color:var(--gold);font-weight:900;letter-spacing:2.5px}
  .bid-banner{
    text-align:center;padding:13px 14px;border-radius:14px;margin-bottom:12px;
    background:rgba(255,255,255,.035);border:1px solid var(--border);
    font-size:13.5px;font-weight:700;
  }
  .bid-banner strong{color:var(--gold);font-weight:900}
  .bid-banner.empty{color:var(--muted);font-size:12.5px;font-weight:600}
  .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:12px}
  .pcard{
    position:relative;padding:14px 8px 12px;border-radius:16px;text-align:center;
    background:var(--surface);border:1px solid var(--border);transition:.25s;overflow:hidden;
  }
  .pcard.active{
    border-color:rgba(251,191,36,.65);
    background:linear-gradient(180deg,rgba(251,191,36,.12),rgba(251,191,36,.04));
    animation:pulseGold 2.4s ease-in-out infinite;
  }
  .pcard.folded,.pcard.broke{opacity:.36;filter:grayscale(.5)}
  .pcard.you::after{
    content:'YOU';position:absolute;bottom:4px;right:6px;
    font-size:7px;font-weight:900;letter-spacing:.8px;color:var(--gold);opacity:.8;
  }
  .p-avatar{
    width:32px;height:32px;border-radius:50%;margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12.5px;color:#fff;overflow:hidden;
  }
  .p-avatar img{width:100%;height:100%;object-fit:cover}
  .pname{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pid{
    font-size:8.5px;font-weight:900;color:var(--gold);letter-spacing:.8px;margin-top:2px;
    font-family:ui-monospace,Menlo,monospace;opacity:.72;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pid.guest{color:#c4b5fd;opacity:.9}
  .pmoney{font-size:16px;font-weight:900;color:var(--green);margin-top:4px}
  .pitems{font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:800}
  .pbadge{
    position:absolute;top:0;left:0;right:0;font-size:7.5px;font-weight:900;
    letter-spacing:1.2px;padding:3px 0;text-align:center;text-transform:uppercase;
  }
  .pbadge.high{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1206}
  .pbadge.out,.pbadge.broke{background:rgba(255,255,255,.13);color:var(--muted)}
  .pcard:has(.pbadge) .p-avatar{margin-top:8px}
  .controls{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px}
  .turn-line{
    text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:14px;
    font-weight:700;letter-spacing:.2px;
  }
  .turn-line strong{color:var(--gold);font-weight:900;font-size:14px}
  .turn-line.you{color:var(--gold)}
  .turn-line.guest-turn{
    background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);
    border-radius:10px;padding:10px;margin-bottom:14px;color:#c4b5fd;
  }
  .bid-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
  .bid-amount{
    font-size:38px;font-weight:900;color:var(--gold);min-width:120px;
    text-align:center;letter-spacing:-1.6px;line-height:1;
    text-shadow:0 0 30px rgba(251,191,36,.35);
  }
  .bid-step{
    width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:700;
    background:rgba(255,255,255,.05);border:1px solid var(--border-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

function initialsOf(name){
  const parts = String(name||'?').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function colorFor(seed){
  let h = 0;
  for (let i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

const registry = {
  local: {}, loaded: false,
  load(){ if (this.loaded) return; try { this.local = JSON.parse(localStorage.getItem(PLAYERS_KEY) || '{}'); } catch(e){ this.local = {}; } this.loaded = true; },
  save(){ try { localStorage.setItem(PLAYERS_KEY, JSON.stringify(this.local)); } catch(e){} },
  normalizeId(s){ return String(s || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, ''); },
  isValidId(id){ return /^[A-Z]{2,4}\d{1,6}$/.test(String(id || '')); },
  randomId(name){
    const letters = String(name || 'PL').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2) || 'PL';
    return letters + String(Math.floor(Math.random() * 9000) + 1000);
  },
  getLocal(id){ this.load(); return this.local[id] || null; },
  async get(id){
    if (!id) return null;
    if (cloud.enabled && cloud.db){
      try { const snap = await cloud.fb.dbMod.getDoc(cloud.fb.dbMod.doc(cloud.db, 'players', id)); if (snap.exists()) return snap.data(); } catch(e){}
    }
    return this.getLocal(id);
  },
  async upsert(id, data){
    if (!id || !this.isValidId(id)) return;
    this.load();
    const existing = this.local[id] || { createdAt: Date.now() };
    const merged = { ...existing, ...data, id, updatedAt: Date.now() };
    this.local[id] = merged;
    this.save();
    if (cloud.enabled && cloud.user && cloud.db){
      try { await cloud.fb.dbMod.setDoc(cloud.fb.dbMod.doc(cloud.db, 'players', id), merged, { merge: true }); } catch(e){}
    }
  },
  async listAll(){
    this.load();
    const map = { ...this.local };
    if (cloud.enabled && cloud.db){
      try {
        const snap = await cloud.fb.dbMod.getDocs(cloud.fb.dbMod.collection(cloud.db, 'players'));
        snap.forEach(d => { const data = d.data(); map[d.id] = { ...(map[d.id] || {}), ...data, id: d.id }; });
      } catch(e){}
    }
    return Object.values(map).sort((a, b) => (b.elo || 0) - (a.elo || 0));
  }
};

/* Boot: import Firebase SDK, wire up auth, run smoke test, start polling */
async function initCloud(){
  registry.load();
  if (!FIREBASE_ENABLED){
    cloud.ready = true;
    console.error('[AuctionWars] Firebase config missing — running in local mode.');
    renderHeader();
    return;
  }
  try {
    console.log('[AuctionWars] Loading Firebase SDK...');
    const [appMod, authMod, dbMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    cloud.auth = authMod.getAuth(app);
    cloud.db = dbMod.getFirestore(app);
    cloud.fb = { authMod, dbMod };
    console.log('[AuctionWars] Firebase initialized. Project:', FIREBASE_CONFIG.projectId);

    authMod.onAuthStateChanged(cloud.auth, async user => {
      console.log('[AuctionWars] Auth state changed:', user ? user.uid : 'signed out');
      cloud.user = user;
      cloud.ready = true;

      if (user){
        await loadUserProfile();
        await pullCloudPacks();

        // Smoke test: verify Firestore read works before starting sync
        cloud.healthy = await firestoreSmokeTest();
        if (!cloud.healthy){
          console.error('[AuctionWars] Firestore smoke test failed — sync will not work.');
          renderHeader();
          if ($('screen-setup').classList.contains('active')) renderSetup();
          return;
        }

        presence.start();
        games.stop();
        games.start(onGamesUpdate);
      } else {
        cloud.profile = loadLocalProfile();
        cloud.healthy = false;
        presence.stop();
        games.stop();
      }
      renderHeader();
      if ($('screen-setup').classList.contains('active')) renderSetup();
    });

    // Handle auth errors
    authMod.onIdTokenChanged(cloud.auth, () => {});
  } catch(e){
    console.error('[AuctionWars] Firebase init FAILED:', e.code || '', e.message || e, e);
    cloud.ready = true;
    renderHeader();
  }
}

/* Smoke test — verifies Firestore is reachable and rules allow our read */
async function firestoreSmokeTest(){
  try {
    console.log('[AuctionWars] Smoke test: reading players collection...');
    const snap = await cloud.fb.dbMod.getDocs(
      cloud.fb.dbMod.query(cloud.fb.dbMod.collection(cloud.db, 'players'), cloud.fb.dbMod.limit(1))
    );
    console.log('[AuctionWars] Firestore smoke test OK — read', snap.size, 'doc(s)');
    return true;
  } catch(e) {
    console.error('[AuctionWars] Firestore smoke test FAILED:', {
      code: e.code,
      message: e.message,
      name: e.name
    });
    if (e.code === 'permission-denied'){
      console.error('[AuctionWars] → Publish your rules in Firebase Console → Firestore → Rules.');
    } else if (e.code === 'failed-precondition'){
      console.error('[AuctionWars] → Firestore may not be enabled. Check Firebase Console → Firestore Database.');
    } else if (e.code === 'unavailable'){
      console.error('[AuctionWars] → Network can\'t reach Firestore. Check your internet connection or ad blocker.');
    } else if (e.code === 'not-found'){
      console.error('[AuctionWars] → Firestore database doesn\'t exist for this project. Create it in Firebase Console.');
    }
    return false;
  }
}

/* ============================================================
   GAMES MODULE — polling primary, listener as bonus
   ============================================================ */
const games = {
  pollTimer: null,
  listenerUnsub: null,
  lastFingerprint: null,
  currentCb: null,
  status: 'idle', // 'live' | 'polling' | 'error'

  start(cb){
    this.stop();
    this.currentCb = cb;
    this.status = 'polling';
    updateSyncDot();

    // Fire immediately, then poll
    this.poll();
    this.pollTimer = setInterval(() => this.poll(), POLL_INTERVAL_MS);

    // Also try to attach a bonus listener (best-effort; if it fails we just keep polling)
    this.attachListener();
  },

  stop(){
    if (this.pollTimer){ clearInterval(this.pollTimer); this.pollTimer = null; }
    if (this.listenerUnsub){ try { this.listenerUnsub(); } catch(e){} this.listenerUnsub = null; }
    this.lastFingerprint = null;
    this.currentCb = null;
    this.status = 'idle';
    updateSyncDot();
  },

  attachListener(){
    if (!cloud.enabled || !cloud.db || !cloud.user) return;
    try {
      const q = cloud.fb.dbMod.query(
        cloud.fb.dbMod.collection(cloud.db, 'games'),
        cloud.fb.dbMod.where('invitedUids', 'array-contains', cloud.user.uid)
      );
      this.listenerUnsub = cloud.fb.dbMod.onSnapshot(q,
        snap => {
          this.status = 'live';
          updateSyncDot();
          this.handleSnapshot(snap);
        },
        err => {
          // Listener died — polling will keep working
          console.error('[AuctionWars] Live listener unavailable (code', err.code, '). Continuing with polling.');
          if (this.listenerUnsub){ try { this.listenerUnsub(); } catch(e){} this.listenerUnsub = null; }
          this.status = 'polling';
          updateSyncDot();
        }
      );
    } catch(e){
      console.error('[AuctionWars] Listener setup threw:', e);
    }
  },

  async poll(){
    if (!cloud.user || !cloud.db || !this.currentCb) return;
    try {
      const q = cloud.fb.dbMod.query(
        cloud.fb.dbMod.collection(cloud.db, 'games'),
        cloud.fb.dbMod.where('invitedUids', 'array-contains', cloud.user.uid)
      );
      const snap = await cloud.fb.dbMod.getDocs(q);
      this.handleSnapshot(snap);
    } catch(e) {
      console.error('[AuctionWars] Poll failed:', { code: e.code, message: e.message });
      this.status = 'error';
      updateSyncDot();
    }
  },

  handleSnapshot(snap){
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    // Prefer running > open > ended, then most recent
    list.sort((a, b) => {
      const rank = s => s === 'running' ? 3 : s === 'open' ? 2 : s === 'ended' ? 1 : 0;
      const ra = rank(a.status), rb = rank(b.status);
      if (ra !== rb) return rb - ra;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    const top = list[0] || null;

    // Deduplicate — only fire callback if something material changed
    const fp = top
      ? `${top.id}|${top.status}|${top.game?.version || 0}|${top.game?.phase || ''}|${top.updatedAt || 0}`
      : 'none';
    if (fp === this.lastFingerprint) return;
    this.lastFingerprint = fp;

    if (this.currentCb) this.currentCb(top);
  },

  async create(participants, settings, items){
    const gameId = 'game_' + uid();
    const invitedUids = [];
    for (const p of participants){
      if (p.uid && !invitedUids.includes(p.uid)) invitedUids.push(p.uid);
    }
    if (!invitedUids.includes(cloud.user.uid)) invitedUids.push(cloud.user.uid);

    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    await cloud.fb.dbMod.setDoc(ref, {
      id: gameId,
      hostUid: cloud.user.uid,
      hostPlayerId: cloud.profile.playerId,
      hostName: cloud.profile.displayName,
      status: 'open',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      invitedUids,
      participants: participants.map((p, i) => ({
        idx: i,
        uid: p.uid || null,
        playerId: p.playerId || null,
        name: p.name,
        photoURL: p.photoURL || '',
        isGuest: !!p.isGuest,
        status: (p.isGuest || p.uid === cloud.user.uid) ? 'joined' : 'invited'
      })),
      items,
      settings,
      game: null,
      eloRecorded: false
    });
    return gameId;
  },

  async join(gameId, myUid){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Game ended');
      const data = snap.data();
      const participants = data.participants.map(p =>
        p.uid === myUid ? { ...p, status: 'joined' } : p
      );
      tx.update(ref, { participants, updatedAt: Date.now() });
    });
  },

  async decline(gameId, myUid){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    try {
      await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const data = snap.data();
        const participants = data.participants.map(p =>
          p.uid === myUid ? { ...p, status: 'declined' } : p
        );
        const invitedUids = (data.invitedUids || []).filter(u => u !== myUid);
        tx.update(ref, { participants, invitedUids, updatedAt: Date.now() });
      });
    } catch(e){ console.error('[AuctionWars] Decline failed:', e); }
  },

  async begin(gameId){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Game ended');
      const data = snap.data();
      if (data.status !== 'open') return;
      const joined = data.participants.filter(p => p.status === 'joined');
      if (joined.length < 2) throw new Error('Need at least 2 joined players');
      const cash = data.settings.cash;
      const game = {
        idx: 0, phase: 'bidding', turnIdx: 0, currentBid: 0, highBidderIdx: null,
        lastSold: null,
        players: joined.map(() => ({ money: cash, items: [], inRound: true })),
        version: 0, updatedAt: Date.now()
      };
      const newParticipants = joined.map((p, i) => ({ ...p, idx: i }));
      const newInvitedUids = newParticipants.filter(p => p.uid).map(p => p.uid);
      tx.update(ref, {
        participants: newParticipants,
        invitedUids: newInvitedUids,
        game, status: 'running',
        startedAt: Date.now(), updatedAt: Date.now()
      });
    });
  },

  async bid(gameId, amount, myUid){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Game ended');
      const data = snap.data();
      if (data.status !== 'running') throw new Error('Game not running');
      const g = data.game;
      if (!g || g.phase !== 'bidding') throw new Error('Not bidding phase');

      const curIdx = g.turnIdx;
      const cur = data.participants[curIdx];
      const myIdx = data.participants.findIndex(p => p.uid === myUid);

      if (!cur.isGuest && myIdx !== curIdx) throw new Error('Not your turn');
      if (myIdx === -1) throw new Error('You are not in this game');

      const curPlayer = g.players[curIdx];
      if (amount <= g.currentBid) throw new Error('Bid must be higher than $' + g.currentBid);
      if (amount > curPlayer.money) throw new Error('Not enough cash');

      const n = g.players.length;
      let nextIdx = curIdx;
      for (let k = 1; k <= n; k++){
        const j = (curIdx + k) % n;
        if (g.players[j].inRound){ nextIdx = j; break; }
      }

      tx.update(ref, {
        'game.currentBid': amount,
        'game.highBidderIdx': curIdx,
        'game.turnIdx': nextIdx,
        'game.version': (g.version || 0) + 1,
        'game.updatedAt': Date.now(),
        updatedAt: Date.now()
      });
    });
  },

  async fold(gameId, myUid){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Game ended');
      const data = snap.data();
      if (data.status !== 'running') throw new Error('Game not running');
      const g = data.game;
      if (!g || g.phase !== 'bidding') throw new Error('Not bidding phase');

      const curIdx = g.turnIdx;
      const cur = data.participants[curIdx];
      const myIdx = data.participants.findIndex(p => p.uid === myUid);
      if (!cur.isGuest && myIdx !== curIdx) throw new Error('Not your turn');

      const newPlayers = g.players.map((p, i) => i === curIdx ? { ...p, inRound: false } : p);
      const activeCount = newPlayers.filter(p => p.inRound).length;

      if (activeCount <= 1){
        const item = data.items[g.idx];
        let winnerIdx = null, price = 0;
        const active = newPlayers.map((p,i)=>({...p,idx:i})).filter(p => p.inRound);
        if (active.length === 1 && g.highBidderIdx !== null && active[0].idx === g.highBidderIdx){
          winnerIdx = g.highBidderIdx;
          price = g.currentBid;
        }
        const updated = newPlayers.map((p, i) => {
          if (i === winnerIdx){
            return { ...p, money: p.money - price, items: [...(p.items||[]), { idx: g.idx, price }] };
          }
          return p;
        });
        tx.update(ref, {
          'game.players': updated,
          'game.phase': 'reveal',
          'game.lastSold': { winnerIdx, price, value: item.value, name: item.name },
          'game.version': (g.version || 0) + 1,
          'game.updatedAt': Date.now(),
          updatedAt: Date.now()
        });
      } else {
        const n = newPlayers.length;
        let nextIdx = curIdx;
        for (let k = 1; k <= n; k++){
          const j = (curIdx + k) % n;
          if (newPlayers[j].inRound){ nextIdx = j; break; }
        }
        tx.update(ref, {
          'game.players': newPlayers,
          'game.turnIdx': nextIdx,
          'game.version': (g.version || 0) + 1,
          'game.updatedAt': Date.now(),
          updatedAt: Date.now()
        });
      }
    });
  },

  async advance(gameId){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    try {
      await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const data = snap.data();
        if (data.status !== 'running') return;
        const g = data.game;
        if (!g || g.phase !== 'reveal') return;

        const nextIdx = g.idx + 1;
        const total = data.items.length;
        const solvent = g.players.filter(p => p.money > 0);

        if (nextIdx >= total || solvent.length <= 1){
          tx.update(ref, {
            status: 'ended',
            'game.phase': 'ended',
            'game.endedAt': Date.now(),
            updatedAt: Date.now()
          });
          return;
        }

        const n = g.players.length;
        let turnIdx = -1;
        for (let k = 0; k < n; k++){
          const j = (nextIdx + k) % n;
          if (g.players[j].money > 0){ turnIdx = j; break; }
        }

        tx.update(ref, {
          'game.idx': nextIdx,
          'game.phase': 'bidding',
          'game.turnIdx': turnIdx,
          'game.currentBid': 0,
          'game.highBidderIdx': null,
          'game.lastSold': null,
          'game.players': g.players.map(p => ({ ...p, inRound: p.money > 0 })),
          'game.version': (g.version || 0) + 1,
          'game.updatedAt': Date.now(),
          updatedAt: Date.now()
        });
      });
    } catch(e){ console.error('[AuctionWars] Advance failed:', e); }
  },

  async cancel(gameId){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    try { await cloud.fb.dbMod.deleteDoc(ref); } catch(e){}
  },

  async leave(gameId, myUid){
    const ref = cloud.fb.dbMod.doc(cloud.db, 'games', gameId);
    try {
      await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        const data = snap.data();
        const invitedUids = (data.invitedUids || []).filter(u => u !== myUid);
        if (invitedUids.length === 0){
          tx.delete(ref);
        } else {
          tx.update(ref, { invitedUids, updatedAt: Date.now() });
        }
      });
    } catch(e){}
  }
};

    return { name: setup.packId, emoji: '', ownerUid: null, items: PACKS[setup.packId].map(([name, value]) => ({ name, value })) };
  }
  return null;

$('screen-setup').addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.pack){ setup.packId = btn.dataset.pack; renderSetup(); }
  else if (btn.dataset.newpack){ openEditor(null); }
  else if (btn.dataset.editpack){
    const pack = setup.myPacks.find(p => p.id === btn.dataset.editpack);
    if (!pack || !isOwner(pack)){ toast('You can only edit your own packs', 'error'); return; }
    openEditor(btn.dataset.editpack);
  } else if (btn.dataset.deletepack){
    const id = btn.dataset.deletepack;
    const pack = setup.myPacks.find(p => p.id === id);
    if (!pack || !isOwner(pack)){ toast('You can only delete your own packs', 'error'); return; }
    if (!confirm('Delete this pack?')) return;
    setup.myPacks = setup.myPacks.filter(p => p.id !== id);
    saveLocalPacks(setup.myPacks);
    deletePackFromCloud(id);
    if (setup.packId === id) setup.packId = Object.keys(PACKS)[0];
    renderSetup();
    toast('Pack deleted');
  } else if (btn.dataset.removeComp){
    setup.pickedIds = setup.pickedIds.filter(id => id !== btn.dataset.removeComp);
    renderSetup();
  } else if (btn.dataset.removeGuest !== undefined){
    setup.guestNames.splice(+btn.dataset.removeGuest, 1);
    renderSetup();
  } else if (btn.id === 'addCompBtn'){ openPlayerPicker(); }
  else if (btn.id === 'addGuestBtn'){ openGuestPrompt(); }
  else if (btn.dataset.cash){
    setup.cash = clamp(setup.cash + (+btn.dataset.cash), 10, 500);
    renderSetup();
  } else if (btn.dataset.items){
    setup.itemCount = +btn.dataset.items;
    renderSetup();
  } else if (btn.id === 'startBtn'){
    await createGame();
  }
});

function openPlayerPicker(){
  const myId = cloud.profile?.playerId;
  const others = setup.onlinePlayers.filter(p => p.id !== myId);
  const taken = new Set(setup.pickedIds);
  const slotsLeft = 4 - (1 + setup.pickedIds.length + setup.guestNames.length);

  const rows = others.map(p => {
    const selected = taken.has(p.id);
    return `
      <button class="picker-row ${selected ? 'sel' : ''}" data-pick-id="${esc(p.id)}">
        <div class="comp-avatar" style="width:34px;height:34px;font-size:12px;background:${p.photoURL ? 'transparent' : colorFor(p.name || 'P')}">
          ${p.photoURL ? `<img src="${esc(p.photoURL)}" alt="">` : esc(initialsOf(p.name || 'P'))}
        </div>
        <div style="flex:1;min-width:0;text-align:left">
          <div style="font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px">
            ${esc(p.name)}<span class="online-dot"></span>
          </div>
          <div style="font-size:10px;color:var(--muted-2);font-weight:800;margin-top:3px;display:flex;gap:6px">
            <span style="font-family:ui-monospace,Menlo,monospace;color:var(--gold);letter-spacing:.6px">${esc(p.id)}</span>
            <span>· Online</span>
          </div>
        </div>
        <div class="picker-check">✓</div>
      </button>
    `;
  }).join('');

  openModal(`
    <div class="modal">
      <div class="modal-title">Add player</div>
      <div class="modal-sub">${slotsLeft} slot${slotsLeft === 1 ? '' : 's'} left. Only online players appear here.</div>
      ${others.length ? `<div class="picker-list" id="pickerList">${rows}</div>` : `
        <div class="picker-empty"><span style="font-size:36px;display:block;margin-bottom:12px;opacity:.5">👥</span>No other players online. Add a guest instead.</div>
      `}
      <div class="modal-actions">
        <button class="btn-ghost" id="pickerCancel">Cancel</button>
        <button class="btn-primary" id="pickerDone" ${others.length === 0 ? 'disabled' : ''}>Done</button>
      </div>
    </div>
  `);
  $('pickerCancel').addEventListener('click', closeModal);
  $('pickerDone').addEventListener('click', closeModal);
  $('pickerList')?.addEventListener('click', e => {
    const row = e.target.closest('[data-pick-id]');
    if (!row) return;
    const id = row.dataset.pickId;
    if (setup.pickedIds.includes(id)){
      setup.pickedIds = setup.pickedIds.filter(x => x !== id);
      row.classList.remove('sel');
    } else {
      const total = 1 + setup.pickedIds.length + setup.guestNames.length;
      if (total >= 4){ toast('Max 4 players', 'error'); return; }
      setup.pickedIds.push(id);
      row.classList.add('sel');
    }
  });
}

/* ============================================================
   CREATE GAME
   ============================================================ */
async function createGame(){
  const pool = getSelectedItems();
  if (pool.length < 2){ toast('This pack needs at least 2 items', 'error'); return; }

  const participants = [];

  if (cloud.user && cloud.profile && cloud.healthy){
    participants.push({
      uid: cloud.user.uid,
      playerId: cloud.profile.playerId,
      name: cloud.profile.displayName || 'You',
      photoURL: cloud.profile.photoURL || '',
      isGuest: false
    });
    const onlineMap = new Map(setup.onlinePlayers.map(p => [p.id, p]));
    for (const id of setup.pickedIds){
      const p = onlineMap.get(id);
      if (p) participants.push({
        uid: p.ownerUid || null,
        playerId: p.id,
        name: p.name,
        photoURL: p.photoURL || '',
        isGuest: false
      });
    }
    for (const name of setup.guestNames){
      participants.push({ uid: null, playerId: null, name, photoURL: '', isGuest: true });
    }
  } else {
    // Local mode
    const names = setup.guestNames.length ? setup.guestNames : ['Player 1', 'Player 2'];
    for (const n of names) participants.push({ uid: null, playerId: null, name: n, photoURL: '', isGuest: true });
    startLocalGame(participants);
    return;
  }

  if (participants.length < 2){ toast('Add at least 1 competitor', 'error'); return; }

  const count = Math.min(setup.itemCount, pool.length);
  const chosen = shuffle(pool).slice(0, count);
  const items = chosen.map(it => ({ name: it.name, value: it.value }));

  try {
    console.log('[AuctionWars] Creating game...');
    const gameId = await games.create(participants, {
      packName: getSelectedLabel(),
      itemCount: count,
      cash: setup.cash
    }, items);
    console.log('[AuctionWars] Game created:', gameId);
    session.gameId = gameId;
  } catch(e){
    console.error('[AuctionWars] Create game failed:', e);
    toast('Failed to create game: ' + (e.code || e.message || 'unknown'), 'error');
  }
}

/* ============================================================
   LOCAL SINGLE-DEVICE MODE
   ============================================================ */
const localGame = { game: null, items: [], participants: [], running: false };

function startLocalGame(participants){
  const pool = getSelectedItems();
  const count = Math.min(setup.itemCount, pool.length);
  const chosen = shuffle(pool).slice(0, count);

  localGame.participants = participants.map((p, i) => ({ ...p, idx: i }));
  localGame.items = chosen.map(it => ({ name: it.name, value: it.value }));
  localGame.game = {
    idx: 0, phase: 'bidding', turnIdx: 0, currentBid: 0, highBidderIdx: null, lastSold: null,
    players: participants.map(() => ({ money: setup.cash, items: [], inRound: true })),
    version: 0, updatedAt: Date.now()
  };
  localGame.running = true;

  session.game = {
    id: 'local',
    status: 'running',
    hostUid: 'local',
    hostPlayerId: null,
    hostName: participants[0].name,
    participants: localGame.participants,
    items: localGame.items,
    settings: { packName: getSelectedLabel(), cash: setup.cash },
    game: localGame.game
  };
  session.myIdx = 0;
  renderGameFromGame();
  showScreen('game');
}

/* ============================================================
   GAMES SNAPSHOT ROUTER
   ============================================================ */
function onGamesUpdate(game){
  if (!game){
    if (session.game && session.game.id === 'local') return;
    session.game = null;
    session.gameId = null;
    session.myIdx = -1;
    if (!$('screen-setup').classList.contains('active')){
      renderSetup();
      showScreen('setup');
    }
    return;
  }

  session.game = game;
  session.gameId = game.id;

  const myUid = cloud.user?.uid;
  const myIdx = game.participants.findIndex(p => p.uid === myUid);
  session.myIdx = myIdx;
  const me = myIdx >= 0 ? game.participants[myIdx] : null;

  if (game.status === 'open'){
    if (me && me.status === 'invited'){
      showInviteModal(game, me);
    } else if (me && me.status === 'joined'){
      closeModal(); // close invite if we joined
      renderWaiting();
      showScreen('waiting');
    }
  } else if (game.status === 'running'){
    if (me && me.status === 'joined'){
      if (session.inviteModalOpen){ session.inviteModalOpen = null; closeModal(); }
      renderGameFromGame();
      showScreen('game');
      scheduleAutoAdvance(game);
    }
  } else if (game.status === 'ended'){
    if (me && me.status === 'joined'){
      if (session.inviteModalOpen){ session.inviteModalOpen = null; closeModal(); }
      renderResultsFromGame();
      showScreen('results');
      maybeRecordElo(game);
    }
  }
}

  const isHost = m.hostUid === cloud.user?.uid;
  const participants = m.participants || [];

          </div>
        `;

/* ============================================================
   GAME SCREEN
   ============================================================ */
function renderGameFromGame(){
  const g = $('screen-game');
  const m = session.game;
  if (!m || !m.game){ return; }

  const items = m.items || [];
  const game = m.game;
  const participants = m.participants || [];
  const players = game.players || [];
  const total = items.length;
  const item = items[game.idx] || { name: '—', value: 0 };
  const curIdx = game.turnIdx;
  const curParticipant = participants[curIdx];
  const isGuestTurn = curParticipant?.isGuest || false;
  const isMyTurn = session.myIdx === curIdx;

  const curPlayer = players[curIdx];
  const minB = game.currentBid + 1;
  const maxB = curPlayer?.money ?? 0;
  session.pendingBid = clamp(session.pendingBid || minB, minB, Math.max(minB, maxB));

  const canBid = game.phase === 'bidding' && (isMyTurn || isGuestTurn) && maxB >= minB;

  g.innerHTML = `
    <div class="topbar">
      <div class="topic-pill"><span>${esc(m.settings?.packName || 'Auction')}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="live-pill"><span class="dot"></span>Live</div>
        <div class="counter">${game.idx + 1}/${total}</div>
      </div>
    </div>
    <div class="progress"><div style="width:${(game.idx / total) * 100}%"></div></div>

    <div class="item-card">
      <div class="item-label">ON THE BLOCK</div>
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-value">Hidden value <span>? ? ?</span></div>
    </div>

    <div class="bid-banner ${game.highBidderIdx === null ? 'empty' : ''}">
      ${game.highBidderIdx === null
        ? 'No bids yet — opening at $1'
        : `Current bid <strong>$${game.currentBid}</strong> by <strong>${esc(participants[game.highBidderIdx]?.name || '—')}</strong>`}
    </div>

    <div class="players">
      ${participants.map((p, i) => {
        const pg = players[i] || { money: 0, items: [], inRound: false };
        const isMe = i === session.myIdx;
        const badge = (i === game.highBidderIdx && game.phase === 'bidding')
          ? '<div class="pbadge high">High bid</div>'
          : (pg.money <= 0) ? '<div class="pbadge broke">Broke</div>'
          : (!pg.inRound ? '<div class="pbadge out">Out</div>' : '');
        return `
          <div class="pcard ${i === curIdx && game.phase === 'bidding' ? 'active' : ''} ${(!pg.inRound && pg.money > 0) ? 'folded' : ''} ${pg.money <= 0 ? 'broke' : ''} ${isMe ? 'you' : ''}">
            ${badge}
            <div class="p-avatar" style="background:${p.photoURL ? 'transparent' : colorFor(p.name)}">
              ${p.photoURL ? `<img src="${esc(p.photoURL)}" alt="">` : esc(initialsOf(p.name))}
            </div>
            <div class="pname">${esc(p.name)}</div>
            ${p.isGuest ? '<div class="pid guest">GUEST</div>' : `<div class="pid">${esc(p.playerId || '')}</div>`}
            <div class="pmoney">$${pg.money}</div>
            <div class="pitems">${(pg.items || []).length} item${(pg.items || []).length === 1 ? '' : 's'}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="controls">
      ${renderTurnLine(curParticipant, isMyTurn, isGuestTurn, game)}
      ${game.phase === 'reveal'
        ? `<div class="cant" style="color:var(--gold)">Settling item…</div>`
        : renderBidControls(canBid, minB, isGuestTurn, curParticipant, isMyTurn, game)}
    </div>
  `;

  if (game.phase === 'reveal' && game.lastSold){
    const key = `${game.idx}-${game.lastSold.winnerIdx}-${game.lastSold.price}`;
    if (session.lastRevealKey !== key){
      session.lastRevealKey = key;
      showRevealFlash(game.lastSold, participants);
    }
  } else if (game.phase === 'bidding'){
    session.lastRevealKey = null;
    hideRevealFlash();
  }
}

function renderTurnLine(cur, isMyTurn, isGuestTurn, game){
  if (game.phase === 'reveal') return `<div class="turn-line">Settling…</div>`;
  if (!cur) return '';
  if (isGuestTurn){
    return `<div class="turn-line guest-turn">🎭 <strong>${esc(cur.name)}</strong> (guest) — anyone can bid</div>`;
  }
  if (isMyTurn){
    return `<div class="turn-line you">🔥 <strong>Your turn</strong> — make a bid</div>`;
  }
  return `<div class="turn-line">Waiting for <strong>${esc(cur.name)}</strong>…</div>`;
}

function renderBidControls(canBid, minB, isGuestTurn, cur, isMyTurn, game){
  if (!canBid){
    const curP = game.players[game.turnIdx];
    if (curP && curP.money < minB){
      return `<div class="cant">Player can't cover $${minB} minimum</div>`;
    }
    return `<div class="spectator-note">Waiting for your turn…</div>`;
  }
  const label = isGuestTurn ? `BID FOR ${cur.name.toUpperCase()}` : `BID $${session.pendingBid}`;
  return `
    <div class="bid-row">
      <button class="bid-step" data-action="dec">−</button>
      <div class="bid-amount">$${session.pendingBid}</div>
      <button class="bid-step" data-action="inc">+</button>
    </div>
    <div class="quick">
      <button data-action="quick" data-v="1">+$1</button>
      <button data-action="quick" data-v="5">+$5</button>
      <button data-action="quick" data-v="all">All in</button>
    </div>
    <button class="btn-bid" data-action="bid">${esc(label)}</button>
    <button class="btn-fold" data-action="fold">Fold</button>
  `;
}

$('screen-game').addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;

  if (session.game?.id === 'local'){
    handleLocalAction(btn);
    return;
  }

  const m = session.game;
  if (!m || !m.game) return;
  const game = m.game;
  if (game.phase !== 'bidding') return;

  const curIdx = game.turnIdx;
  const cur = m.participants[curIdx];
  const isGuestTurn = cur?.isGuest;
  const isMyTurn = session.myIdx === curIdx;
  if (!isMyTurn && !isGuestTurn) return;

  const curPlayer = game.players[curIdx];
  const minB = game.currentBid + 1;
  const maxB = curPlayer?.money ?? 0;

  if (btn.dataset.action === 'inc'){
    session.pendingBid = Math.min(session.pendingBid + 1, maxB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'dec'){
    session.pendingBid = Math.max(session.pendingBid - 1, minB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'quick'){
    const v = btn.dataset.v;
    if (v === 'all') session.pendingBid = maxB;
    else session.pendingBid = clamp(session.pendingBid + (+v), minB, maxB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'bid'){
    const amt = session.pendingBid;
    if (amt <= game.currentBid || amt > curPlayer.money) return;
    try {
      await games.bid(m.id, amt, cloud.user.uid);
      // Force immediate poll so my own action reflects instantly
      games.poll();
    }
    catch(err){ toast(err.message || 'Bid failed', 'error'); }
  } else if (btn.dataset.action === 'fold'){
    try {
      await games.fold(m.id, cloud.user.uid);
      games.poll();
    }
    catch(err){ toast(err.message || 'Failed', 'error'); }
  }
});

/* Local actions */
function handleLocalAction(btn){
  const g = localGame.game;
  if (g.phase !== 'bidding') return;
  const curIdx = g.turnIdx;
  const curPlayer = g.players[curIdx];
  const minB = g.currentBid + 1;
  const maxB = curPlayer.money;

  if (btn.dataset.action === 'inc'){
    session.pendingBid = Math.min(session.pendingBid + 1, maxB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'dec'){
    session.pendingBid = Math.max(session.pendingBid - 1, minB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'quick'){
    const v = btn.dataset.v;
    if (v === 'all') session.pendingBid = maxB;
    else session.pendingBid = clamp(session.pendingBid + (+v), minB, maxB);
    renderGameFromGame();
  } else if (btn.dataset.action === 'bid'){
    const amt = session.pendingBid;
    if (amt <= g.currentBid || amt > curPlayer.money) return;
    g.currentBid = amt;
    g.highBidderIdx = curIdx;
    const n = g.players.length;
    for (let k = 1; k <= n; k++){
      const j = (curIdx + k) % n;
      if (g.players[j].inRound){ g.turnIdx = j; break; }
    }
    renderGameFromGame();
  } else if (btn.dataset.action === 'fold'){
    g.players[curIdx].inRound = false;
    const active = g.players.filter(p => p.inRound).length;
    if (active <= 1){
      resolveLocalItem();
    } else {
      const n = g.players.length;
      for (let k = 1; k <= n; k++){
        const j = (curIdx + k) % n;
        if (g.players[j].inRound){ g.turnIdx = j; break; }
      }
      renderGameFromGame();
    }
  }
}

function resolveLocalItem(){
  const g = localGame.game;
  const active = g.players.map((p, i) => ({ ...p, idx: i })).filter(p => p.inRound);
  let winnerIdx = null, price = 0;
  if (active.length === 1 && g.highBidderIdx !== null && active[0].idx === g.highBidderIdx){
    winnerIdx = g.highBidderIdx;
    price = g.currentBid;
  }
  const item = localGame.items[g.idx];
  if (winnerIdx !== null){
    g.players[winnerIdx].money -= price;
    g.players[winnerIdx].items.push({ idx: g.idx, price });
  }
  g.phase = 'reveal';
  g.lastSold = { winnerIdx, price, value: item.value, name: item.name };
  session.lastRevealKey = `${g.idx}-${winnerIdx}-${price}`;
  renderGameFromGame();
  showRevealFlash(g.lastSold, localGame.participants);

  setTimeout(() => {
    hideRevealFlash();
    session.lastRevealKey = null;
    const nextIdx = g.idx + 1;
    const solvent = g.players.filter(p => p.money > 0).length;
    if (nextIdx >= localGame.items.length || solvent <= 1){
      localGame.running = false;
      session.game.status = 'ended';
      session.game.game = g;
      renderResultsFromGame();
      showScreen('results');
      return;
    }
    g.idx = nextIdx;
    g.phase = 'bidding';
    g.currentBid = 0;
    g.highBidderIdx = null;
    g.lastSold = null;
    g.players.forEach(p => p.inRound = p.money > 0);
    const n = g.players.length;
    for (let k = 0; k < n; k++){
      const j = (nextIdx + k) % n;
      if (g.players[j].inRound){ g.turnIdx = j; break; }
    }
    renderGameFromGame();
  }, REVEAL_MS);
}

function scheduleAutoAdvance(m){
  if (!m.game || m.game.phase !== 'reveal') return;
  if (session.advancing) return;
  session.advancing = true;
  setTimeout(async () => {
    try { await games.advance(m.id); } catch(e){}
    session.advancing = false;
  }, REVEAL_MS);
}

function showRevealFlash(sold, participants){
  const el = $('flashOverlay');
  const winnerName = sold.winnerIdx !== null ? participants[sold.winnerIdx]?.name : null;
  if (winnerName){
    const profit = sold.value - sold.price;
    const cls = profit >= 0 ? 'pos' : 'neg';
    const sign = profit >= 0 ? '+' : '−';
    el.innerHTML = `
      <div class="flash-inner">
        <div class="flash-sold">SOLD!</div>
        <div class="flash-item">${esc(sold.name)}</div>
        <div class="flash-price">${esc(winnerName)} pays $${sold.price}</div>
        <div class="flash-profit ${cls}">Value ${sold.value} · ${sign}$${Math.abs(profit)}</div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="flash-inner">
        <div class="flash-sold unsold">NO SALE</div>
        <div class="flash-item">${esc(sold.name)}</div>
        <div class="flash-price">Everyone folded · value was ${sold.value}</div>
      </div>`;
  }
  el.classList.add('show');
}
function hideRevealFlash(){ $('flashOverlay').classList.remove('show'); }

const eloRecorded = {};

function renderResultsFromGame(){
  const m = session.game;
  if (!m) return;

  const items = m.items || [];
  const participants = m.participants || [];
  const players = m.game?.players || [];

  const ranked = participants.map((p, i) => {
    const pg = players[i] || { money: 0, items: [] };
    const itemObjs = (pg.items || []).map(it => {
      const itm = items[it.idx] || { name: 'Item', value: 0 };
      return { name: itm.name, value: itm.value, price: it.price };
    });
    return {
      name: p.name, id: p.playerId, photoURL: p.photoURL, isGuest: p.isGuest,
      money: pg.money, items: itemObjs,
      total: itemObjs.reduce((s, it) => s + it.value, 0),
      spent: itemObjs.reduce((s, it) => s + it.price, 0),
      isYou: i === session.myIdx,
      idx: i
    };
  }).sort((a, b) => (b.total - a.total) || (b.money - a.money));

  ranked.forEach((r, i) => r.placement = i);

  const soldIdxs = new Set();
  players.forEach(p => (p.items || []).forEach(it => soldIdxs.add(it.idx)));
  const unsold = items.map((it, i) => ({ ...it, idx: i })).filter(it => !soldIdxs.has(it.idx));

  const top = ranked[0];
  const tie = ranked.length > 1 && ranked[1].total === top.total && ranked[1].money === top.money;
  const medals = ['🥇','🥈','🥉','4️⃣'];

  $('screen-results').innerHTML = `
    <div class="winner-box">
      <div class="crown">${tie ? '🤝' : '👑'}</div>
      <div class="wlabel">${tie ? 'DEAD HEAT' : 'WINNER'}</div>
      <div class="wname">${esc(top.name)}</div>
      <div class="wsub">${top.total} total value · $${top.money} left</div>
    </div>

    <div class="rank-list">
      ${ranked.map((r, i) => `
        <div class="rank-row ${i === 0 ? 'first' : ''} ${r.isGuest ? 'guest' : ''}">
          <div class="rank-head">
            <span class="medal">${medals[i] || ''}</span>
            <span class="rname">
              ${esc(r.name)}
              ${r.isGuest ? '<span class="guest-tag">GUEST</span>' : (r.id ? `<span class="rid">${esc(r.id)}</span>` : '')}
              ${r.isYou ? '<span class="lb-you">You</span>' : ''}
            </span>
            <span class="rval">${r.total} pts</span>
          </div>
          <div class="rline">$${r.money} left · spent $${r.spent} · ${r.items.length} item${r.items.length === 1 ? '' : 's'}</div>
          <div class="ritems">
            ${r.items.length
              ? r.items.map(it => {
                  const profit = it.value - it.price;
                  const cls = profit >= 0 ? 'profit' : 'loss';
                  const sign = profit >= 0 ? '+' : '−';
                  return `<span class="chip">${esc(it.name)} <b>${it.value}</b>
                          <span class="paid ${cls}">${sign}$${Math.abs(profit)}</span></span>`;
                }).join('')
              : '<span class="muted" style="font-size:11px;font-weight:700">bought nothing 😬</span>'}
          </div>
        </div>
      `).join('')}
    </div>

    ${unsold.length ? `
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Went unsold</div></div>
        <div class="ritems" style="margin-left:0">
          ${unsold.map(it => `<span class="chip">${esc(it.name)} <b>${it.value}</b></span>`).join('')}
        </div>
      </div>
    ` : ''}

    <button class="btn-primary" id="againBtn">Back to setup</button>
    <button class="btn-secondary" id="lbFromResults" style="margin-top:8px">View leaderboard</button>
  `;

  $('againBtn').addEventListener('click', async () => {
    if (m.id !== 'local'){
      try { await games.leave(m.id, cloud.user.uid); } catch(e){}
    }
    localGame.running = false;
    session.game = null;
    session.gameId = null;
    session.myIdx = -1;
    setup.pickedIds = [];
    setup.guestNames = [];
    renderSetup();
    showScreen('setup');
  });
  $('lbFromResults').addEventListener('click', () => {
    renderLeaderboard();
    showScreen('leaderboard');
    renderHeader();
  });
}

async function maybeRecordElo(m){
  if (!cloud.enabled || !cloud.user || !m || !cloud.healthy) return;
  if (m.id === 'local' || m.eloRecorded) return;
  if (eloRecorded[m.id]) return;
  eloRecorded[m.id] = true;

  const ref = cloud.fb.dbMod.doc(cloud.db, 'games', m.id);
  try {
    let claimed = false;
    await cloud.fb.dbMod.runTransaction(cloud.db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) return;
      const data = snap.data();
      if (data.eloRecorded) return;
      tx.update(ref, { eloRecorded: true, eloRecordedAt: Date.now() });
      claimed = true;
    });
    if (!claimed) return;
  } catch(e){ console.error('[AuctionWars] Elo claim failed:', e); return; }

  const participants = m.participants || [];
  const players = m.game?.players || [];
  const items = m.items || [];

  const ranked = participants.map((p, i) => {
    const pg = players[i] || { items: [] };
    const total = (pg.items || []).reduce((s, it) => {
      const itm = items[it.idx] || { value: 0 };
      return s + itm.value;
    }, 0);
    return { id: p.playerId, name: p.name, isGuest: p.isGuest, total, placement: 0 };
  }).sort((a, b) => b.total - a.total);
  ranked.forEach((r, i) => r.placement = i);

  const identified = ranked.filter(r => !r.isGuest && r.id && registry.isValidId(r.id));
  if (!identified.length) return;

  const records = await Promise.all(identified.map(async r => {
    const data = await registry.get(r.id);
    return { id: r.id, name: r.name, placement: r.placement, elo: data?.elo ?? 1000, prev: data || null };
  }));

  const ratings = ranked.map(r => {
    if (!r.isGuest && r.id && registry.isValidId(r.id)){
      const rec = records.find(x => x.id === r.id);
      return { rating: rec?.elo ?? 1000, placement: r.placement };
    }
    return { rating: GUEST_ELO, placement: r.placement };
  });

  const K = 32, n = ratings.length;
  const deltas = ratings.map(() => 0);
  for (let i = 0; i < n; i++){
    for (let j = 0; j < n; j++){
      if (i === j) continue;
      const Ea = 1 / (1 + Math.pow(10, (ratings[j].rating - ratings[i].rating) / 400));
      let Sa = 0.5;
      if (ratings[i].placement < ratings[j].placement) Sa = 1;
      else if (ratings[i].placement > ratings[j].placement) Sa = 0;
      deltas[i] += (K / (n - 1)) * (Sa - Ea);
    }
  }

  for (const rec of records){
    const idx = ranked.findIndex(r => r.id === rec.id);
    const delta = deltas[idx];
    const newElo = clamp(rec.elo + delta, 100, 4000);
    const prev = rec.prev || {};
    const won = rec.placement === 0;
    await registry.upsert(rec.id, {
      name: rec.name, elo: newElo,
      wins: (prev.wins || 0) + (won ? 1 : 0),
      games: (prev.games || 0) + 1,
      totalValue: (prev.totalValue || 0) + (ranked[idx]?.total || 0),
      ownerUid: prev.ownerUid || null
    });
  }
}

let lbSort = 'elo';

async function renderLeaderboard(){
  const el = $('screen-leaderboard');
  el.innerHTML = `
    <div class="lb-header"><h2>Leaderboard</h2><p>Loading…</p></div>
    <div class="empty-state"><span class="big"><div class="spin" style="margin:0 auto;width:20px;height:20px;border-width:3px"></div></span></div>
    <button class="btn-secondary" id="lbBack">Back</button>
  `;
  $('lbBack').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });

  let list = (await registry.listAll()).filter(u => u && u.id);
  if (lbSort === 'wins') list.sort((a, b) => (b.wins || 0) - (a.wins || 0) || (b.elo || 0) - (a.elo || 0));
  else if (lbSort === 'games') list.sort((a, b) => (b.games || 0) - (a.games || 0) || (b.elo || 0) - (a.elo || 0));
  else list.sort((a, b) => (b.elo || 0) - (a.elo || 0));

  const myId = cloud.profile?.playerId;

  if (!list.length){
    el.innerHTML = `
      <div class="lb-header"><h2>Leaderboard</h2><p>No games yet</p></div>
      <div class="empty-state"><span class="big">🏆</span>Play a match to claim the top spot.</div>
      <button class="btn-secondary" id="lbBack2">Back</button>
    `;
    $('lbBack2').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });
    return;
  }

  el.innerHTML = `
    <div class="lb-header"><h2>Leaderboard</h2><p>${list.length} tracked player${list.length === 1 ? '' : 's'}</p></div>
    <div class="lb-tabs">
      <button class="lb-tab ${lbSort === 'elo' ? 'sel' : ''}" data-sort="elo">Elo</button>
      <button class="lb-tab ${lbSort === 'wins' ? 'sel' : ''}" data-sort="wins">Wins</button>
      <button class="lb-tab ${lbSort === 'games' ? 'sel' : ''}" data-sort="games">Games</button>
    </div>
    <div class="lb-list">
      ${list.slice(0, 100).map((u, i) => {
        const rank = i + 1;
        const rankCls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const isMe = myId && u.id === myId;
        const name = u.name || 'Player';
        return `
          <div class="lb-row ${isMe ? 'me' : ''}">
            <div class="lb-rank ${rankCls}">${medal}</div>
            <div class="lb-avatar" style="background:${colorFor(name)}">${esc(initialsOf(name))}</div>
            <div class="lb-info">
              <div class="lb-name">${esc(name)}<span class="lb-pid">${esc(u.id)}</span>${isMe ? '<span class="lb-you">You</span>' : ''}</div>
              <div class="lb-stats">${u.wins || 0}W · ${u.games || 0}G · ${(u.totalValue || 0)} total value</div>
            </div>
            <div class="lb-elo">${u.elo || 1000}<small>ELO</small></div>
          </div>
        `;
      }).join('')}
    </div>
    <button class="btn-secondary" id="lbBack3">Back</button>
  `;
  el.querySelectorAll('.lb-tab').forEach(tab => {
    tab.addEventListener('click', () => { lbSort = tab.dataset.sort; renderLeaderboard(); });
  });
  $('lbBack3').addEventListener('click', () => { renderSetup(); showScreen('setup'); renderHeader(); });
}

/* ============================================================
   PACK EDITOR
   ============================================================ */
const editor = { id: null, emoji: '✨', name: '', items: [{ name: '', value: 5 }], bulkOpen: false };

function openEditor(id){
  const existing = id ? setup.myPacks.find(p => p.id === id) : null;
  editor.id = existing ? existing.id : null;
  editor.emoji = existing ? existing.emoji : '✨';
  editor.name = existing ? existing.name : '';
  editor.items = existing && existing.items.length ? existing.items.map(it => ({ name: it.name, value: it.value })) : [{ name: '', value: 5 }];
  editor.bulkOpen = false;
  renderEditor();
}

function renderEditor(){
  openModal(`
    <div class="modal">
      <div class="modal-title">${editor.id ? 'Edit pack' : 'Create pack'}</div>
      <div class="modal-sub">Give every item a fixed value. Values stay hidden during the auction and only count at the end.</div>

      <div class="field">
        <label class="field-label">Icon</label>
        <div class="emoji-row" id="emojiRow">
          ${EMOJI_CHOICES.map(e => `<button class="emoji-opt ${e === editor.emoji ? 'sel' : ''}" data-emoji="${e}">${e}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="edName">Pack name</label>
        <input id="edName" class="editor-input" maxlength="24" placeholder="e.g. Horror Movies" value="${esc(editor.name)}">
      </div>

      <div class="field">
        <label class="field-label">Items &amp; values</label>
        <div class="items-list" id="itemsList"></div>
        <div class="items-toolbar">
          <button id="addRowBtn">＋ Add item</button>
          <button id="bulkToggle">📋 Bulk paste</button>
        </div>
        <div class="items-meta">
          <span><b id="itemCount">0</b> items</span>
          <span>Total value: <b id="totalValue">0</b></span>
        </div>
        <div class="bulk-area ${editor.bulkOpen ? 'show' : ''}" id="bulkArea">
          <textarea id="bulkText" placeholder="Charizard | 10&#10;Pikachu | 8&#10;Magikarp | 3"></textarea>
          <div class="bulk-hint">One per line: <code>Name | Value</code> or <code>Name, Value</code>.</div>
          <button class="btn-secondary" id="bulkApply" style="margin-top:8px">Replace list</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-ghost" id="edCancel">Cancel</button>
        <button class="btn-primary" id="edSave">Save pack</button>
      </div>
      ${editor.id ? `<button class="btn-ghost btn-danger" id="edDelete" style="width:100%;margin-top:8px">Delete pack</button>` : ''}
    </div>
  `);
  renderItemRows();
  $('edName').addEventListener('input', e => { editor.name = e.target.value; });
  $('edCancel').addEventListener('click', closeModal);
  $('addRowBtn').addEventListener('click', () => {
    editor.items.push({ name: '', value: 5 });
    renderItemRows();
    const ins = $('itemsList').querySelectorAll('.item-name-in');
    if (ins.length) ins[ins.length - 1].focus();
  });
  $('bulkToggle').addEventListener('click', () => {
    editor.bulkOpen = !editor.bulkOpen;
    $('bulkArea').classList.toggle('show', editor.bulkOpen);
  });
  $('bulkApply').addEventListener('click', () => {
    const parsed = parseBulk($('bulkText').value);
    if (!parsed.length){ toast('Nothing to import', 'error'); return; }
    editor.items = parsed;
    editor.bulkOpen = false;
    renderEditor();
    toast(`Imported ${parsed.length} items`, 'success');
  });
  $('edSave').addEventListener('click', saveEditor);
  $('edDelete')?.addEventListener('click', deleteEditor);
  $('emojiRow').addEventListener('click', e => {
    const b = e.target.closest('[data-emoji]');
    if (!b) return;
    editor.emoji = b.dataset.emoji;
    $('emojiRow').querySelectorAll('.emoji-opt').forEach(x => x.classList.toggle('sel', x.dataset.emoji === editor.emoji));
  });
}

function parseBulk(text){
  const out = [];
  String(text).split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    let name = line, val = 5, m;
    if ((m = line.match(/^(.+?)\s*\|\s*(-?\d+)\s*$/))){ name = m[1].trim(); val = parseInt(m[2], 10); }
    else if ((m = line.match(/^(.+?)\s*[,:]\s*(-?\d+)\s*$/))){ name = m[1].trim(); val = parseInt(m[2], 10); }
    name = name.replace(/^[-•*]\s*/, '').trim();
    if (!name) return;
    out.push({ name, value: clamp(isNaN(val) ? 5 : val, 1, 99) });
  });
  return out;
}

function renderItemRows(){
  const list = $('itemsList');
  if (!list) return;
  list.innerHTML = editor.items.map((it, i) => `
    <div class="item-row">
      <input class="item-name-in" maxlength="40" placeholder="Item name" value="${esc(it.name)}" data-i="${i}">
      <div class="val-wrap"><input class="item-val-in" type="number" min="1" max="99" inputmode="numeric" value="${it.value}" data-i="${i}"></div>
      <button class="item-del" data-i="${i}">×</button>
    </div>
  `).join('');
  list.querySelectorAll('.item-name-in').forEach(inp => {
    inp.addEventListener('input', e => { editor.items[+e.target.dataset.i].name = e.target.value; updateEditorMeta(); });
  });
  list.querySelectorAll('.item-val-in').forEach(inp => {
    inp.addEventListener('input', e => { editor.items[+e.target.dataset.i].value = clamp(parseInt(e.target.value, 10) || 1, 1, 99); updateEditorMeta(); });
  });
  list.querySelectorAll('.item-del').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = +e.target.dataset.i;
      if (editor.items.length <= 1) editor.items = [{ name: '', value: 5 }];
      else editor.items.splice(i, 1);
      renderItemRows();
    });
  });
  updateEditorMeta();
}

function updateEditorMeta(){
  const c = $('itemCount'), t = $('totalValue');
  if (!c || !t) return;
  const valid = editor.items.filter(it => it.name.trim());
  c.textContent = valid.length;
  t.textContent = valid.reduce((s, it) => s + it.value, 0);
}

async function saveEditor(){
  const name = editor.name.trim();
  const items = editor.items.map(it => ({ name: it.name.trim(), value: clamp(it.value, 1, 99) })).filter(it => it.name);
  if (!name){ toast('Give your pack a name', 'error'); return; }
  if (items.length < 2){ toast('Add at least 2 items', 'error'); return; }
  if (editor.id){
    const p = setup.myPacks.find(x => x.id === editor.id);
    if (!p || !isOwner(p)){ toast('You can only edit your own packs', 'error'); return; }
    p.name = name; p.emoji = editor.emoji; p.items = items;
    await pushPackToCloud(p);
  } else {
    const newPack = {
      id: 'custom_' + uid(), name, emoji: editor.emoji, items,
      ownerUid: cloud.user?.uid || null,
      ownerPlayerId: cloud.profile?.playerId || null,
      ownerName: cloud.profile?.displayName || 'Local'
    };
    setup.myPacks.push(newPack);
    setup.packId = newPack.id;
    await pushPackToCloud(newPack);
  }
  saveLocalPacks(setup.myPacks);
  closeModal();
  renderSetup();
  toast('Pack saved', 'success');
}

async function deleteEditor(){
  if (!editor.id) return;
  const p = setup.myPacks.find(x => x.id === editor.id);
  if (!p || !isOwner(p)){ toast('You can only delete your own packs', 'error'); return; }
  if (!confirm('Delete this pack?')) return;
  setup.myPacks = setup.myPacks.filter(x => x.id !== editor.id);
  saveLocalPacks(setup.myPacks);
  await deletePackFromCloud(editor.id);
  if (setup.packId === editor.id) setup.packId = Object.keys(PACKS)[0];
  closeModal();
  renderSetup();
  toast('Pack deleted');
}

(async () => {
  registry.load();

  renderHeader();
  initCloud();
